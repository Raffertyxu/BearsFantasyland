const VERT = `#version 300 es
in vec2 p; out vec2 vUv; void main(){ vUv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;
const COMMON = `#version 300 es
precision highp float;
#define PI 3.14159265
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}
float ease(float t){return t<.5?4.*t*t*t:1.-pow(-2.*t+2.,3.)/2.;}
float sweep(float v,float p,float e){return smoothstep(v,v+e,p*(1.+e));}
vec2 coverUV(vec2 uv, vec2 img, vec4 c, vec2 res){
  float ra=res.x/res.y, ia=img.x/img.y;
  vec2 s = ra>ia ? vec2(1., ia/ra) : vec2(ra/ia, 1.);
  s /= c.x;
  vec2 q = uv-.5; q.x *= ra;
  float cs=cos(c.w), sn=sin(c.w); q = mat2(cs,-sn,sn,cs)*q; q.x /= ra;
  vec2 room = 1.-s;
  return (q+.5)*s + room*c.yz;
}
`;
// 轉場（與 brand.html 相同的九種轉場，調色移到後製）
const FRAG_T = COMMON + `
in vec2 vUv; out vec4 o;
uniform sampler2D uT0, uT1;
uniform vec2 uRes, uS0, uS1;
uniform vec4 uC0, uC1;
uniform float uL0, uL1, uP, uTime;
uniform int uFx;
vec4 layer(sampler2D t, vec2 img, vec4 c, float L, vec2 uv){
  if(L<.5) return texture(t, coverUV(uv,img,c,uRes));
  if(L<1.5){
    vec4 bg = textureLod(t, coverUV(uv,img,vec4(1.2,.5,.5,0.),uRes), 5.5);
    bg.rgb *= .42;
    float h=.8; float w=h*(img.x/img.y)/(uRes.x/uRes.y);
    vec2 ctr=vec2(.94-w*.5,.5);
    vec2 q=(uv-ctr)/vec2(w,h)+.5;
    if(q.x>=0.&&q.x<=1.&&q.y>=0.&&q.y<=1.) return texture(t, coverUV(q,img,c,vec2(w*uRes.x,h*uRes.y)));
    vec2 dq=max(abs(uv-ctr)-vec2(w,h)*.5,0.);
    float sh=exp(-length(dq*vec2(uRes.x/uRes.y,1.))*28.);
    bg.rgb *= 1.-.55*sh;
    return bg;
  }
  vec4 b = textureLod(t, coverUV(uv,img,c,uRes), 3.2);
  b.rgb *= .3;
  return b;
}
vec4 A(vec2 uv){return layer(uT0,uS0,uC0,uL0,uv);}
vec4 B(vec2 uv){return layer(uT1,uS1,uC1,uL1,uv);}
void main(){
  vec2 uv=vUv; float p=uP; float ra=uRes.x/uRes.y; float s=sin(p*PI);
  vec4 col;
  if(p<=0.){ col=A(uv); }
  else if(p>=1.){ col=B(uv); }
  else if(uFx==0){
    float g=fbm(vec2(uv.x*2.2,uv.y*22.+fbm(uv*3.)*4.));
    float v=clamp(uv.x*.62+g*.38,0.,1.);
    float m=sweep(v,p,.08); float edge=1.-abs(m*2.-1.);
    vec2 d=vec2(0.,(g-.5)*.05*edge);
    col=mix(A(uv+d),B(uv-d),m);
    col.rgb+=vec3(1.,.6,.26)*pow(edge,3.)*.65;
  } else if(uFx==1){
    vec2 q=(uv-.5)*vec2(ra,1.); float dist=length(q);
    float maxR=length(vec2(ra,1.))*.5; float r=p*(maxR+.3);
    float band=smoothstep(.28,0.,abs(dist-r))*s;
    vec2 dir=dist>0.?q/dist:vec2(0.);
    float w=sin(dist*38.-p*26.)*.02*band+sin(dist*12.-p*9.)*.012*s;
    vec2 off=dir*w/vec2(ra,1.);
    float m=1.-smoothstep(r-.14,r+.02,dist);
    col=mix(A(uv+off),B(uv-off*1.4),m);
    col.rgb+=vec3(1.,.9,.75)*band*.08;
  } else if(uFx==2){
    float n=7.; float id=floor(uv.x*n); float fx=fract(uv.x*n);
    float delay=id/(n-1.)*.42; float lp=ease(clamp((p-delay)/.58,0.,1.));
    float m=step(1.-lp,uv.y);
    vec4 a=A(vec2(uv.x,uv.y+lp*.25)); a.rgb*=1.-.4*lp;
    vec4 b=B(vec2(uv.x,uv.y-(1.-lp)*.35)); b.rgb*=mix(.7,1.,lp);
    col=mix(a,b,m);
    float line=smoothstep(.004,0.,abs(uv.y-(1.-lp)))*step(.001,lp)*step(lp,.999);
    col.rgb+=vec3(1.,.82,.6)*line*.8;
    col.rgb*=1.-smoothstep(.985,1.,fx)*.35*s;
  } else if(uFx==3){
    vec2 c=vec2(.5); vec4 a=vec4(0.), b=vec4(0.);
    for(int i=0;i<16;i++){ float t=float(i)/15.; float k=1.-t*.16*s;
      a+=A(c+(uv-c)*(1.-p*.3)*k); b+=B(c+(uv-c)*(1.-(1.-p)*.3)*k); }
    col=mix(a/16.,b/16.,smoothstep(.38,.62,p));
    col.rgb+=vec3(1.,.84,.62)*pow(s,5.)*.28;
  } else if(uFx==4){
    float n=fbm(uv*vec2(ra,1.)*2.4+vec2(0.,p*.7));
    float v=clamp((uv.x*.55+(1.-uv.y)*.45)*.7+n*.3,0.,1.);
    float m=sweep(v,p,.2); float edge=1.-abs(m*2.-1.);
    vec2 d=(vec2(n)-.5)*.07*edge;
    col=mix(A(uv+d),B(uv-d*.5),m);
    col.rgb*=1.-edge*.5;
  } else if(uFx==5){
    float n=noise(vec2(uv.y*9.,3.1))*.5+noise(vec2(uv.y*42.,7.))*.18;
    float v=clamp((1.-uv.x)*.78+n*.32,0.,1.);
    float m=sweep(v,p,.12); float edge=1.-abs(m*2.-1.);
    float sh=.01*s+.022*edge;
    vec2 ua=uv+vec2(p*.08,0.), ub=uv-vec2((1.-p)*.08,0.);
    vec4 a=vec4(A(ua+vec2(sh,0.)).r,A(ua).g,A(ua-vec2(sh,0.)).b,1.);
    vec4 b=vec4(B(ub+vec2(sh,0.)).r,B(ub).g,B(ub-vec2(sh,0.)).b,1.);
    col=mix(a,b,m);
    col.rgb+=vec3(1.,.95,.9)*pow(edge,6.)*.3;
  } else if(uFx==6){
    vec4 a=vec4(0.), b=vec4(0.);
    float pe=ease(p);
    for(int i=0;i<14;i++){ float k=(float(i)/13.-.5)*s*.16;
      a+=A(uv+vec2(pe*.55+k,0.)); b+=B(uv-vec2((1.-pe)*.55,0.)+vec2(k,0.)); }
    col=mix(a/14.,b/14.,smoothstep(.42,.58,p));
    col.rgb*=1.+s*.08;
  } else if(uFx==7){
    float m=smoothstep(.25,.75,p);
    vec2 cc=vec2(.5);
    col=mix(A(cc+(uv-cc)*(1.-p*.04)), B(cc+(uv-cc)*(1.+(1.-p)*.04)), m);
    float l=fbm(uv*vec2(1.4,.7)+vec2(uTime*.35,uTime*.1));
    vec3 leak=vec3(1.,.55,.22)*smoothstep(.35,.85,l+s*.55-uv.x*.35)*s
             +vec3(1.,.8,.55)*smoothstep(.6,1.,1.-length((uv-vec2(.85,.75))*vec2(ra,1.)*.9))*s*.8;
    col.rgb=1.-(1.-col.rgb)*(1.-clamp(leak*.6,0.,1.));
  } else {
    float gap=ease(p)*.5;
    float top=step(.5,uv.y);
    vec4 a=A(vec2(uv.x, uv.y + mix(gap,-gap,top)));
    a.rgb*=1.-gap*.8;
    vec4 b=B(.5+(uv-.5)*(1.-.12*(1.-p)));
    float m=step(abs(uv.y-.5),gap);
    col=mix(a,b,m);
    float line=smoothstep(.003,0.,abs(abs(uv.y-.5)-gap))*step(.001,gap)*step(gap,.499);
    col.rgb+=vec3(1.,.85,.65)*line*.9;
  }

    const a = e * (txt === '木' ? 1 - fill : side);
    if (a <= .002) return;
    ctx.save(); ctx.globalAlpha = a; ctx.filter = e < .98 ? `blur(${((1 - e) * 18).toFixed(1)}px)` : 'none';
    const drift = txt === '木' ? 0 : (1 - side) * (x < cx ? -60 : 60);
    ctx.fillText(txt, x + drift, by + (1 - e) * 30);
    ctx.restore();
  };
  showWord('與', cx - wMu / 2 - gap - wYu, 0);
  showWord('木', cx - wMu / 2, 1);
  showWord('一起', cx + wMu / 2 + gap, 2);
  ctx.restore();

  if (fill > 0) {
    im.save(); im.clearRect(0, 0, W, H); apply(im);
    im.font = font; im.textAlign = 'left'; im.textBaseline = 'alphabetic'; im.fillStyle = '#fff';
    im.fillText('木', cx - wMu / 2, by);
    im.restore();
    im.save(); im.globalCompositeOperation = 'source-in'; im.drawImage(glCanvas, 0, 0); im.restore();
    ctx.save(); ctx.globalAlpha = fill; ctx.drawImage(introMask, 0, 0); ctx.restore();
  }
  const full = clamp01((zk - .88) / .12);
  if (full > 0) { ctx.save(); ctx.globalAlpha = full; ctx.drawImage(glCanvas, 0, 0); ctx.restore(); }
}

/* ---------- 01 分割畫格的文字 ---------- */
function drawPanelLabels(t) {
  if (!quadActive(t)) return;
  const fadeOut = 1 - clamp01((t - QUAD.expand + .25) / .35);
  if (fadeOut <= 0) return;
  PANELS.forEach((p, i) => {
    const st = panelState(i, t);
    const [x, y, w] = st.rect;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, H); ctx.clip();
    ctx.globalAlpha = fadeOut * st.k;
    const g = ctx.createLinearGradient(0, H, 0, H * .5);
    g.addColorStop(0, 'rgba(14,11,9,.82)'); g.addColorStop(1, 'rgba(14,11,9,0)');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, H);
    ctx.restore();
    const tin = QUAD.labels + i * .14, tout = QUAD.expand - .3;
    const lx = x + 40, ly = y + H - 190;
    maskText(p.num, lx, ly, `400 34px ${LATIN}`, AMBER, phase(t, tin, tout, .8, .3), { spacing:'2px' });
    line(lx + 52, ly - 11, 40, AMBER, inOut(t, tin + .1, tout, .7, .3), .9);
    maskText(p.title, lx, ly + 66, `600 42px ${SERIF}`, CREAM, phase(t, tin + .06, tout, .8, .3), { spacing:'4px' });
    maskText(p.sub, lx, ly + 112, `400 21px ${SANS}`, SOFT, phase(t, tin + .12, tout, .8, .3), { spacing:'2px' });
  });
}

/* ---------- 02 規格標註線 ---------- */
function drawCallouts(t) {
  const { shot, tin, tout, items } = CALLOUTS;
  if (t < tin || t > tout + .5) return;
  const s = SHOTS[shot];
  items.forEach((c, i) => {
    const t0 = tin + i * .3;
    const [px, py] = imgToScreen(s, t, c.at[0], c.at[1]);
    const [lx, ly] = c.to;
    const o = 1 - easeInCubic(clamp01((t - tout - i * .05) / .35));
    const dot = easeOutExpo(clamp01((t - t0) / .5));
    const ln = easeInOutCubic(clamp01((t - t0 - .15) / .55));
    if (dot <= 0) return;
    ctx.save(); ctx.globalAlpha = o;
    // 呼吸光圈
    const pulse = ((t - t0) % 1.6) / 1.6;
    ctx.strokeStyle = `rgba(217,164,106,${(1 - pulse) * .7})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(px, py, 10 + pulse * 22, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = CREAM; ctx.beginPath(); ctx.arc(px, py, 6 * dot, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = AMBER; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px, py, 11 * dot, 0, Math.PI * 2); ctx.stroke();
    // 折線：先斜後橫
    if (ln > 0) {
      const ex = lx - 20, ey = ly;
      const seg1 = Math.hypot(ex - px, ey - py), seg2 = 180, tot = seg1 + seg2;
      const d = ln * tot;
      ctx.strokeStyle = 'rgba(248,246,242,.85)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(px, py);
      if (d <= seg1) ctx.lineTo(px + (ex - px) * d / seg1, py + (ey - py) * d / seg1);
      else { ctx.lineTo(ex, ey); ctx.lineTo(ex + (d - seg1), ey); }
      ctx.stroke();
    }
    ctx.restore();
    // 深色底片讓標籤在淺色背景上也清楚
    const chip = inOut(t, t0 + .45, tout + i * .05, .6, .3);
    if (chip > 0) {
      ctx.save(); ctx.font = `600 40px ${SERIF}`; ctx.letterSpacing = '4px';
      const cw = Math.max(ctx.measureText(c.cn).width, 110) + 44;
      ctx.globalAlpha = chip * .62; ctx.fillStyle = '#16110d';
      ctx.beginPath(); ctx.roundRect(lx - 8, ly - 66, cw, 112, 14); ctx.fill();
      ctx.restore();
    }
    maskText(c.cn, lx + 14, ly - 16, `600 40px ${SERIF}`, CREAM, phase(t, t0 + .55, tout + i * .05, .8, .3), { spacing:'4px' });
    maskText(c.en, lx + 14, ly + 28, `500 20px ${LATIN}`, AMBER, phase(t, t0 + .65, tout + i * .05, .8, .3), { spacing:'8px' });
  });
}

/* ---------- 03 合作流程 ---------- */
function drawProcess(t) {
  const [a, b] = PROCESS;
  if (t < a || t > b + .5) return;
  const vis = inOut(t, a, b, .6, .35);
  const x0 = M, x1 = W - M, ly = H - 205;
  const n = STEPS.length;
  const nodeX = (i) => lerp(x0, x1, i / (n - 1));
  let cur = 0;
  STEPS.forEach((s, i) => { if (t >= s[0]) cur = i; });
  const prog = clamp01((t - STEPS[0][0]) / (STEPS[n - 1][0] - STEPS[0][0]));
  ctx.save(); ctx.globalAlpha = vis;
  ctx.fillStyle = 'rgba(248,246,242,.25)'; ctx.fillRect(x0, ly, (x1 - x0) * easeOutExpo(clamp01((t - a) / .9)), 2);
  ctx.fillStyle = AMBER; ctx.fillRect(x0, ly, (x1 - x0) * easeInOutSine(prog), 2);
  STEPS.forEach((s, i) => {
    const on = t >= s[0];
    const k = easeOutExpo(clamp01((t - s[0]) / .5));
    const x = nodeX(i);
    ctx.fillStyle = on ? AMBER : '#3a3029';
    ctx.strokeStyle = on ? AMBER : 'rgba(248,246,242,.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, ly + 1, 7 + k * 3 * (i === cur ? 1 : 0), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (i === cur && on) {
      ctx.strokeStyle = `rgba(217,164,106,${(1 - k) * .8})`;
      ctx.beginPath(); ctx.arc(x, ly + 1, 10 + k * 26, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.font = `500 24px ${SERIF}`; ctx.letterSpacing = '4px';
    ctx.textAlign = i === 0 ? 'left' : i === n - 1 ? 'right' : 'center';
    ctx.fillStyle = i === cur && on ? CREAM : on ? SOFT : FAINT;
    ctx.fillText(s[2], x, ly + 52);
    ctx.font = `400 20px ${LATIN}`; ctx.letterSpacing = '4px';
    ctx.fillStyle = on ? AMBER : FAINT;
    ctx.fillText(s[1], x, ly - 22);
  });
  ctx.restore();
  // 大號步驟字卡
  STEPS.forEach((s, i) => {
    const tin = s[0] + .08, tout = i < n - 1 ? STEPS[i + 1][0] - .2 : b - .1;
    const y = H - 360;
    maskText(s[1], M - 6, y + 10, `300 210px ${LATIN}`, CREAM, phase(t, tin, tout, .7, .2), { alpha:.95 });
    maskText(s[2], M + 300, y - 70, `600 76px ${SERIF}`, CREAM, phase(t, tin + .06, tout, .7, .2), { spacing:'8px' });
    maskText(s[3], M + 304, y - 2, `400 30px ${SANS}`, SOFT, phase(t, tin + .12, tout, .7, .2), { spacing:'4px' });
  });
}

/* ---------- 05 永續四原則：線條圖示描繪 ---------- */
const ICONS = (() => {
  const leaf = new Path2D('M32 6 C10 18 10 46 32 58 C54 46 54 18 32 6 Z M32 14 L32 62 M32 30 L22 22 M32 40 L43 31');
  const home = new Path2D('M6 30 L32 9 L58 30 M13 25 L13 56 L51 56 L51 25 M26 56 L26 40 L38 40 L38 56');
  const loop = new Path2D('M32 32 C24 19 7 19 7 32 C7 45 24 45 32 32 C40 19 57 19 57 32 C57 45 40 45 32 32 Z');
  const renew = new Path2D();
  renew.arc(32, 32, 22, -Math.PI * .3, Math.PI * 1.45);
  renew.moveTo(41, 4); renew.lineTo(51.5, 14.5); renew.lineTo(37, 18);
  return { leaf:[leaf, 240], home:[home, 260], loop:[loop, 190], renew:[renew, 200] };
})();
function drawSustain(t) {
  const { tin, tout, items, sdg } = SUSTAIN;
  if (t < tin || t > tout + .6) return;
  const colW = 380, x0 = W / 2 - colW * 2, y = H / 2 - 120;
  items.forEach(([icon, title, sub], i) => {
    const t0 = tin + i * .22;
    const cx = x0 + colW * i + colW / 2;
    const o = 1 - easeInCubic(clamp01((t - tout - i * .04) / .35));
    const k = easeInOutCubic(clamp01((t - t0) / 1.1));
    const [path, len] = ICONS[icon];
    if (k > 0) {
      ctx.save(); ctx.globalAlpha = o;
      ctx.translate(cx - 54, y - 64); ctx.scale(1.7, 1.7);
      ctx.strokeStyle = AMBER; ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.setLineDash([len, len]); ctx.lineDashOffset = len * (1 - k);
      ctx.shadowColor = 'rgba(217,164,106,.55)'; ctx.shadowBlur = 12 * k;
      ctx.stroke(path);
      ctx.restore();
    }
    if (i > 0) { ctx.save(); ctx.globalAlpha = o * easeOutExpo(clamp01((t - t0) / .8)) * .3; ctx.fillStyle = CREAM; ctx.fillRect(x0 + colW * i, y - 40, 1, 220); ctx.restore(); }
    maskText(title, cx, y + 110, `600 44px ${SERIF}`, CREAM, phase(t, t0 + .35, tout + i * .04, .8, .3), { align:'center', spacing:'6px' });
    maskText(sub, cx, y + 158, `400 23px ${SANS}`, SOFT, phase(t, t0 + .45, tout + i * .04, .8, .3), { align:'center', spacing:'2px' });
  });
  // SDGs
  const t1 = tin + 1.35, sy = H - 230;
  maskText('SDGs', W / 2, sy - 70, `500 22px ${LATIN}`, AMBER, phase(t, t1, tout, .8, .3), { align:'center', spacing:'10px' });
  line(W / 2, sy - 50, 120, AMBER, inOut(t, t1 + .1, tout, .8, .3), .7, 'center');
  ctx.save(); ctx.font = `400 22px ${SANS}`; ctx.letterSpacing = '2px';
  const parts = sdg.map(([n, l]) => ({ n, l, w: 64 + ctx.measureText(l).width }));
  ctx.restore();
  const tot = parts.reduce((a, p) => a + p.w, 0) + 64 * (parts.length - 1);
  let x = W / 2 - tot / 2;
  parts.forEach((p, i) => {
    const ph = phase(t, t1 + .2 + i * .12, tout, .8, .3);
    const nw = maskText(p.n, x, sy + 4, `500 46px ${LATIN}`, CREAM, ph);
    maskText(p.l, x + Math.max(nw, 28) + 12, sy, `400 22px ${SANS}`, SOFT, ph, { spacing:'2px' });
    x += p.w + 64;
  });
}

/* ---------- 06 售後三項 ---------- */
function drawServices(t) {
  const { tin, tout, items } = SERVICES;
  if (t < tin || t > tout + .6) return;
  const x = M, y0 = H / 2 - 170, row = 150, w = 760;
  maskText('AFTER SERVICE', x, y0 - 40, `500 26px ${LATIN}`, AMBER, phase(t, tin - .2, tout, .8, .3), { spacing:'10px' });
  items.forEach(([title, sub], i) => {
    const t0 = tin + i * .18, y = y0 + i * row;
    line(x, y, w, 'rgba(248,246,242,.35)', inOut(t, t0, tout + i * .04, .9, .3));
    maskText('0' + (i + 1), x, y + 76, `400 34px ${LATIN}`, AMBER, phase(t, t0 + .1, tout + i * .04, .8, .3), { spacing:'2px' });
    maskText(title, x + 90, y + 78, `600 52px ${SERIF}`, CREAM, phase(t, t0 + .16, tout + i * .04, .8, .3), { spacing:'6px' });
    maskText(sub, x + 92, y + 122, `400 26px ${SANS}`, SOFT, phase(t, t0 + .22, tout + i * .04, .8, .3), { spacing:'3px' });
  });
  line(x, y0 + items.length * row, w, 'rgba(248,246,242,.35)', inOut(t, tin + .54, tout + .12, .9, .3));
}

/* ---------- 片尾：Logo 掃光＋合作洽詢 ---------- */
function drawOutro(t) {
  if (t < OUTRO - .2) return;
  const k = easeOutExpo(clamp01((t - OUTRO) / 1.2));
  const lw = 640, lh = lw * logo.height / logo.width;
  const sc = lerp(.94, 1, k);
  // 掃光帶
  const sp = clamp01((t - OUTRO - .9) / 1.3);
  shineCtx.clearRect(0, 0, shine.width, shine.height);
  shineCtx.globalCompositeOperation = 'source-over';
  shineCtx.drawImage(logo, 0, 0);
  if (sp > 0 && sp < 1) {
    shineCtx.globalCompositeOperation = 'source-atop';
    const bx = lerp(-.4, 1.4, easeInOutSine(sp)) * shine.width, bw = shine.width * .22;
    const g = shineCtx.createLinearGradient(bx - bw, 0, bx + bw, shine.height * .3);
    g.addColorStop(0, 'rgba(255,214,160,0)'); g.addColorStop(.5, 'rgba(255,226,186,.95)'); g.addColorStop(1, 'rgba(255,214,160,0)');
    shineCtx.fillStyle = g; shineCtx.fillRect(0, 0, shine.width, shine.height);
  }
  ctx.save(); ctx.globalAlpha = k;
  ctx.translate(W / 2, H / 2 - 150); ctx.scale(sc, sc);
  ctx.drawImage(shine, -lw / 2, -lh / 2, lw, lh);
  ctx.restore();
  line(W / 2, H / 2 - 10, 300, AMBER, easeOutExpo(clamp01((t - OUTRO - .4) / .9)), .9, 'center');
  charText('與我們談合作', W / 2, H / 2 + 92, `600 64px ${SERIF}`, CREAM, t, OUTRO + .55, null, { align:'center', spacing:14, stagger:.06 });
  maskText('家具採購　·　空間合作　·　永續合作　·　教育／文化合作', W / 2, H / 2 + 160, `400 26px ${SANS}`, AMBER, phase(t, OUTRO + 1.1, null, .9), { align:'center', spacing:'6px' });
  const cy = H / 2 + 270;
  line(W / 2, cy - 52, 1080, 'rgba(248,246,242,.25)', easeOutExpo(clamp01((t - OUTRO - 1.4) / 1.0)), 1, 'center');
  const items = [['電話', '04-24616373'], ['手機', '0921 747 056'], ['LINE', '@iaz2765b'], ['EMAIL', 'bearlovearth@gmail.com']];
  const colW = 270, x0 = W / 2 - colW * 2;
  items.forEach(([label, val], i) => {
    const cx = x0 + colW * i + colW / 2;
    const ph = phase(t, OUTRO + 1.5 + i * .1, null, .9);
    maskText(label, cx, cy - 8, `500 20px ${/[A-Z]/.test(label) ? LATIN : SANS}`, AMBER, ph, { align:'center', spacing:'6px' });
    maskText(val, cx, cy + 32, `400 ${i === 3 ? 25 : 28}px ${SANS}`, CREAM, phase(t, OUTRO + 1.56 + i * .1, null, .9), { align:'center', spacing:'1px' });
  });
}

function drawOverlay(t) {
  ctx.clearRect(0, 0, W, H);
  if (t < INTRO.end) drawIntro(t);
  else ctx.drawImage(glCanvas, 0, 0);

  // 左下壓暗讓字清楚；置中字卡另外整體壓暗；分割畫格與片尾除外
  const quadK = quadActive(t) ? clamp01((t - QUAD.tin - .3) / .6) * (1 - clamp01((t - QUAD.full + .1) / .3)) : 0;
  const presence = clamp01((t - INTRO.end + .2) / .7) * (1 - clamp01((t - OUTRO + .6) / .6)) * (1 - quadK);
  if (presence > 0) {
    ctx.save(); ctx.globalAlpha = presence;
    let g = ctx.createLinearGradient(0, 0, W * .62, 0);
    g.addColorStop(0, 'rgba(18,14,11,.66)'); g.addColorStop(1, 'rgba(18,14,11,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    g = ctx.createLinearGradient(0, H, 0, H * .45);
    g.addColorStop(0, 'rgba(18,14,11,.72)'); g.addColorStop(1, 'rgba(18,14,11,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    g = ctx.createLinearGradient(0, 0, 0, H * .28);
    g.addColorStop(0, 'rgba(18,14,11,.5)'); g.addColorStop(1, 'rgba(18,14,11,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  let dim = 0;
  CAPTIONS.forEach((c) => {
    if (!c.dim) return;
    const k = clamp01((t - c.tin + .5) / .6) * (1 - clamp01((t - c.tout - .2) / .6));
    dim = Math.max(dim, c.dim * k);
  });
  // 永續四原則與售後列表需要較暗的底
  dim = Math.max(dim, .3 * inOut(t, SUSTAIN.tin - .3, SUSTAIN.tout, .8, .5));
  if (dim > 0) { ctx.fillStyle = `rgba(14,11,9,${dim})`; ctx.fillRect(0, 0, W, H); }

  drawPanelLabels(t);

  // 章節標（分割畫格期間上移到畫格之上仍保留）
  CHAPTERS.forEach(([a, b, num, en, cn]) => {
    const tin = a + .1, tout = b - .35;
    const ph = phase(t, tin, tout, .8, .3);
    if (!ph) return;
    const y = 132;
    maskText(num, M, y, `400 34px ${LATIN}`, AMBER, ph, { spacing:'2px' });
    const lk = easeOutExpo(clamp01((t - tin - .1) / .7)) * (1 - easeInCubic(clamp01((t - tout) / .3)));
    line(M + 58, y - 11, 56, AMBER, lk, .9);
    const w = maskText(cn, M + 136, y, `500 30px ${SERIF}`, CREAM, phase(t, tin + .06, tout, .8, .3), { spacing:'4px' });
    maskText(en, M + 136 + w + 22, y - 2, `400 20px ${LATIN}`, SOFT, phase(t, tin + .12, tout, .8, .3), { spacing:'6px' });
  });

  CAPTIONS.forEach((c) => drawCaption(c, t));
  drawCallouts(t);
  drawProcess(t);
  drawSustain(t);
  drawServices(t);

  // 故事進度線
  if (t > STORY_START - .4 && t < STORY_END + .6) {
    const k = clamp01((t - STORY_START + .4) / .5) * (1 - clamp01((t - STORY_END) / .5));
    const prog = clamp01((t - STORY_START) / (STORY_END - STORY_START));
    ctx.save(); ctx.globalAlpha = k;
    ctx.fillStyle = 'rgba(248,246,242,.22)'; ctx.fillRect(M, H - 70, W - M * 2, 2);
    ctx.fillStyle = CREAM; ctx.fillRect(M, H - 70, (W - M * 2) * prog, 2);
    ctx.restore();
  }

  drawOutro(t);

  const black = Math.max(1 - clamp01(t / .5), clamp01((t - (DURATION - .6)) / .6));
  if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
}

function renderFrame(t) { drawGL(t); drawOverlay(t); }

function report(msg) { return fetch('/log', { method:'POST', body:String(msg) }).catch(() => {}); }

/* ---------------- modes ---------------- */
const hud = document.getElementById('hud');
if (params.has('render')) {
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  await report('GL ' + (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)));
  const total = Math.round(DURATION * FPS);
  for (let f = 0; f < total; f++) {
    renderFrame(f / FPS);
    const data = ctx.getImageData(0, 0, W, H).data;
    const r = await fetch('/frame', { method:'POST', body:data.buffer });
    if (!r.ok) { await report('ERROR frame ' + f); return; }
    if (f % 30 === 0) await report(`frame ${f}/${total}`);
  }
  await fetch('/done', { method:'POST' });
} else if (params.has('t')) {
  renderFrame(Number(params.get('t')) || 0);
  hud.textContent = 't=' + params.get('t');
  document.title = 'ready';
} else {
  const start = performance.now();
  const loop = (now) => {
    const t = ((now - start) / 1000) % DURATION;
    renderFrame(t);
    hud.textContent = t.toFixed(2) + 's';
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
})().catch((err) => {
  document.body.insertAdjacentHTML('beforeend', `<pre style="color:#f88;position:fixed;top:0">${err.stack}</pre>`);
  fetch('/log', { method:'POST', body:'ERROR ' + err.stack }).catch(() => {});
});
</script>
