  ?render            逐格送給 render.mjs 編碼
  ?render&times=a,b  只送指定時間點（render.mjs --stills）
  無參數             即時預覽，點一下畫面連同配樂播放
  所有剪點依 audio/beatmap.json：110 BPM，第 k 拍在 k × 60/110 秒，剪點對齊到最近的畫格。
  畫面完全是時間 t 的純函數（無狀態），任一畫格可單獨算出。
*/

const BEAT = 60 / 110;
const AUDIO_START = 16.333;
const BASE = '../../website/assets/';

const cutT = (b) => Math.round(b * BEAT * FPS) / FPS; // 剪點對齊畫格

/* ---------------- easing ---------------- */
const clamp01 = (x) => Math.min(Math.max(x, 0), 1);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const smoother = (t) => t * t * t * (t * (t * 6 - 15) + 10);
const easeOutExpo = (t) => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInCubic = (t) => t * t * t;
const easeInQuad = (t) => t * t;
const win = (t, a, b) => clamp01((t - a) / (b - a));
// 攝影機慣性曲線：glide = 切入時已在移動、指數減速（不等速）；cd = 從靜止起步的臨界阻尼；sstep = 靜止到靜止
const EASE = {
  glide: (u, k = 1.5) => (1 - Math.exp(-k * u)) / (1 - Math.exp(-k)),
  cd: (u, w = 5) => { const f = (x) => 1 - (1 + w * x) * Math.exp(-w * x); return f(u) / f(1); },
  sstep: (u) => smoother(u),
  lin: (u) => u
};

/* ---------------- WebGL2 ---------------- */
const glCanvas = document.getElementById('gl');
const gl = glCanvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, premultipliedAlpha: false, alpha: false });
if (!gl) { document.body.textContent = 'WebGL2 not available'; report('ERROR no webgl2'); return; }

const VERT = `#version 300 es
layout(location=0) in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;

const PANEL = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform vec2 uImg;
uniform vec4 uRect;      // x, y(top-down), w, h px
uniform vec2 uC;         // image center, y down
uniform float uScale;    // screen px per image px
uniform float uRoll;
uniform vec2 uShift;     // whip offset (panel frac)
uniform vec2 uPar;
uniform float uDolly;
uniform vec4 uDepth;     // a gy gx pivot
uniform vec4 uSub;
uniform float uFocus, uAp, uExpo, uSharp, uBackdrop, uRB;
uniform vec2 uMB;        // motion blur px
uniform vec4 uLight;     // pos width angle base (base<0 off)
out vec4 o;
float nearness(vec2 q){
  float n = uDepth.x + uDepth.y*(q.y-.5) + uDepth.z*(q.x-.5);
  vec2 d = (q-uSub.xy)*vec2(uRect.z/uRect.w,1.);
  n += uSub.w*exp(-dot(d,d)/(uSub.z*uSub.z));
  return clamp(n,0.,1.);
}
vec2 toImg(vec2 q){
  q -= uShift;
  float dn = nearness(q) - uDepth.w;
  q -= uPar*dn;
  q = .5 + (q-.5)/(1.+uDolly*dn);
  vec2 p = (q-.5)*uRect.zw;
  float cs=cos(uRoll), sn=sin(uRoll);
  p = mat2(cs,sn,-sn,cs)*p;
  return uC + p/(uImg*uScale);
}
vec3 tap(vec2 iuv, float lod){ return textureLod(uTex, vec2(iuv.x, 1.-iuv.y), lod).rgb; }
void main(){
  vec2 fc = gl_FragCoord.xy;
  vec2 q = vec2((fc.x-uRect.x)/uRect.z, ((1080.-fc.y)-uRect.y)/uRect.w);
  vec3 col;
  if(uBackdrop>.5){
    vec2 iuv = toImg(q); col = vec3(0.);
    for(int i=0;i<9;i++){ vec2 d=vec2(float(i%3)-1.,float(i/3)-1.)*.025; col += tap(iuv+d, 6.); }
    col *= .26/9.;
  } else {
    float n = nearness(q);
    float r = min(uAp*abs(n-uFocus), 30.);
    float mb = length(uMB);
    if(r<.7 && mb<.7 && uRB<.0008){
      vec2 iuv = toImg(q);
      col = tap(iuv,0.);
      vec3 bl = .25*(tap(iuv+vec2(.7,0.)/uImg,0.)+tap(iuv-vec2(.7,0.)/uImg,0.)+tap(iuv+vec2(0.,.7)/uImg,0.)+tap(iuv-vec2(0.,.7)/uImg,0.));
      col = max(col + uSharp*(col-bl), 0.);
    } else {
      const int N = 24; const float GA = 2.39996;
      // 景深用等向的 mip 模糊；動態模糊只沿運動方向取樣，mip 只補一點避免分段（否則垂直方向也會糊）
      float lodDof = log2(max(r/sqrt(float(N))*1.6, 1.)/uScale);
      float lodMb = log2(max(max(mb, uRB*uRect.z*.5)/float(N)*.4, 1.)/uScale);
      float lod = clamp(max(lodDof, lodMb), 0., 6.);
      vec3 acc = vec3(0.);

const coverScale = (p) => Math.max(p.rect[2] / p.asset.w, p.rect[3] / p.asset.h);
// 影像點 P 要落在畫面位置 S（panel 比例）時，影像中心應在哪
function anchorC(p, Pt, S, z) {
  const sc = coverScale(p) * z;
  return [Pt[0] - (S[0] - .5) * p.rect[2] / (p.asset.w * sc), Pt[1] - (S[1] - .5) * p.rect[3] / (p.asset.h * sc)];
}
function screenOf(p, Pt, c, z) {
  const sc = coverScale(p) * z;
  return [.5 + (Pt[0] - c[0]) * p.asset.w * sc / p.rect[2], .5 + (Pt[1] - c[1]) * p.asset.h * sc / p.rect[3]];
}
// match cut：上一鏡結尾的特徵點對齊下一鏡開頭的特徵點（同一個畫面位置）
SHOTS.forEach((s, i) => {
  if (!s.matchIn) return;
  const prev = SHOTS[i - 1], pa = prev.panels[0], pb = s.panels[0];
  const S = screenOf(pb, s.matchIn.P, pb.c[0], pb.z[0]);
  pa.c[1] = anchorC(pa, prev.match.P, S, pa.z[1]);
  if (!pa.c[0]) pa.c[0] = pa.c[1].slice();

// 每拍的 scale kick：2 格內推上去，再快速回穩
function kickEnv(t, s) {
  if (!s.kick) return 0;
  const k = Math.floor((t + 1e-6) / BEAT) * BEAT;
  const tau = t - Math.max(k, s.start);
  if (tau < 0) return 0;
  return tau < 1 / 15 ? tau * 15 : Math.exp(-(tau - 1 / 15) / .12);
}

function panelState(s, p, t) {
  const D = s.end - s.start;
  const u0 = clamp01((t - s.start) / D);
  const [name, k] = p.ease;
  const u = EASE[name](u0, k);
  let z = lerp(p.z[0], p.z[1], u);
  let rb = 0, mb = [0, 0], shift = [0, 0];
  z *= 1 + (s.kick || 0) * kickEnv(t, s);
  if (s.impact) {
    const tau = t - s.start, d = s.impact.dur;
    const e = easeOutCubic(clamp01(tau / d));
    z *= 1 + s.impact.dz * e;
    const vel = tau < d ? s.impact.dz * 3 * Math.pow(1 - tau / d, 2) / d : 0; // dz/dt
    rb = vel / FPS * 1.4;
  }
  const whip = (w, tau, out) => {
    const e = 1 - clamp01(tau / w.dur);
    const amt = .22;
    const off = amt * e * e * (out ? -1 : 1);
    const vel = 2 * amt * e / w.dur / FPS; // panel frac per frame
    shift = [w.dir[0] * off, w.dir[1] * off];
    mb = [w.dir[0] * vel * p.rect[2] * 1.3, w.dir[1] * vel * p.rect[3] * 1.3];

  if (s.whipOut && s.end - t < s.whipOut.dur + 1e-6) whip(s.whipOut, s.end - t, true);

  const dolly = lerp(p.dolly[0], p.dolly[1], u);
  const sc = coverScale(p) * z;

  const sx = p.rect[2] / (p.asset.w * sc), sy = p.rect[3] / (p.asset.h * sc);
  const mx = Math.abs(par[0]) * .5 * sx + .002, my = Math.abs(par[1]) * .5 * sy + .002;

}

  ctx.globalAlpha = clamp01(tau / .25) * (1 - outK);
  ctx.beginPath(); ctx.rect(W / 2 - half, cy - 220, half * 2, 360); ctx.clip();
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 40;
  ctx.drawImage(titleCanvas, 0, cy - 220);
  ctx.restore();
  // 細線與英文副標
  const lk = easeOutExpo(win(tau, .35, 1.25));
  hair(W / 2, cy + 44, 300, AMBER, .85 * (1 - outK), 'center', lk);
  const st = win(tau, .5, 1.3);
  text("BEAR'S FANTASYLAND", W / 2, cy + 104, { family: LATIN, weight: 500, size: 26, spacing: lerp(30, 17, easeOutExpo(st)) + outK * 6,
    alpha: .82 * easeOutCubic(st) * (1 - outK), align: 'center', blur: (1 - easeOutCubic(st)) * 6 + outK * 6, shadow: .3 });
}
const easeInOutSine = (x) => -(Math.cos(Math.PI * x) - 1) / 2;

// 黑邊內的小字：淡入＋字距收攏＋模糊轉清晰
function barLabel(str, x, y, t0, t1, o) {
  const a = easeOutCubic(win(o.t, t0, t0 + .45)) * (1 - smooth(win(o.t, t1 - .25, t1)));
  if (a <= 0) return 0;
  const k = 1 - easeOutExpo(win(o.t, t0, t0 + .7));
  return text(str, x, y, Object.assign({}, o, { alpha: (o.alpha ?? 1) * a, spacing: o.spacing + k * 5, blur: k * 3 }));
}

function drawOverlay(t, s) {
  ctx.clearRect(0, 0, W, H);
  const yTop = BAR / 2 + 8, yBot = H - BAR / 2 + 8;

  // 前奏：黑邊內一行很小的英文
  if (t < T.b4) {
    barLabel('SOLID WOOD  ·  MADE BY HAND  ·  TAIWAN', W / 2, yBot, .75, T.b4 - .1,
      { t, family: LATIN, weight: 400, size: 17, spacing: 9, align: 'center', alpha: .62 });
  }
  drawTitle(t);

  // 鋪陳 A：工藝字卡（黑邊內）
  if (s.craft != null) {
    const [zh, en] = CRAFT[s.craft];
    const t0 = s.start + .25, t1 = s.end - .05;
    const w = barLabel(zh, 110, yBot + 2, t0, t1, { t, size: 24, weight: 500, spacing: 16, alpha: .92 });
    const lk = easeOutExpo(win(t, t0 + .15, t0 + .9)) * (1 - smooth(win(t, t1 - .25, t1)));
    hair(110 + w + 26, yBot - 7, 36, AMBER, .8, 'left', lk);
    barLabel(en, 110 + w + 80, yBot, t0 + .12, t1, { t, family: LATIN, weight: 400, size: 16, spacing: 8, alpha: .58 });
  }

  // 鋪陳 B：系列名在上黑邊、作品名在下黑邊（作品名跟著剪點硬切）
  if (s.sec === 'B' && t < T.b36) {
    const t0 = T.b20 + .3, t1 = T.b36;
    const w = barLabel('MU 木生活系列', 110, yTop, t0, t1, { t, size: 21, weight: 500, spacing: 7, alpha: .9 });
    barLabel('MU COLLECTION', 110 + w + 24, yTop - 1, t0 + .12, t1, { t, family: LATIN, weight: 400, size: 15, spacing: 8, alpha: .5 });
    if (s.work) {
      const wk = WORKS[s.work];
      const first = SHOTS.find((x) => x.work === s.work);
      const last = SHOTS.filter((x) => x.work === s.work).pop();
      const a0 = first.start + .06, a1 = last.end;
      const w2 = barLabel(wk[0], 110, yBot, a0, a1 + .3, { t, size: 22, weight: 500, spacing: 12, alpha: .92 });
      barLabel(wk[1], 110 + w2 + 22, yBot - 1, a0 + .08, a1 + .3, { t, family: LATIN, weight: 500, size: 15, spacing: 8, alpha: .55 });
      barLabel(`${wk[2]}　·　${wk[3]}`, W - 110, yBot, a0 + .12, a1 + .3, { t, size: 16, weight: 500, spacing: 5, alpha: .55, align: 'right' });
    }
  }

  // 近乎無聲段的品牌句：逐字由模糊轉清晰
  if (t >= T.b37 && t < T.b40) {
    const chars = [...BRAND_LINE];
    const size = 44, spacing = 14;
    const total = measure(BRAND_LINE, size, 500, SERIF, spacing);
    let x = W / 2 - total / 2;
    const out = smooth(win(t, T.b40 - .42, T.b40 - .12));
    chars.forEach((ch, i) => {
      const a = easeOutCubic(win(t, T.b37 + .28 + i * .055, T.b37 + .28 + i * .055 + .6));
      const w = measure(ch, size, 500, SERIF, 0);
      text(ch, x, 838, { size, weight: 500, alpha: .93 * a * (1 - out), blur: (1 - a) * 9 + out * 8, shadow: .4 });
      x += w + spacing;
    });
  }

  // 高潮：系列切換字卡（遮罩由左向右展開；墨色隨鏡頭明暗切換）
  if (s.sec === 'C' && s.series != null && !s.noCard) {
    const blockStart = SHOTS.find((x) => x.sec === 'C' && x.series === s.series).start;
    const k = easeOutExpo(win(t, blockStart + .04, blockStart + .38));
    const rgb = s.ink === 'light' ? CREAM : INK;
    const shadow = s.ink === 'light' ? .35 : 0;
    const x0 = 104, y0 = 128;
    const no = String(s.series + 1).padStart(2, '0');
    const [zh, en] = SERIES[s.series];
    const wn = measure(no, 26, 500, LATIN, 2);
    const wz = measure(zh, 28, 600, SERIF, 8);
    const full = wn + 22 + 36 + 22 + wz + 26 + measure(en, 15, 500, LATIN, 7) + 20;
    ctx.save();
    ctx.beginPath(); ctx.rect(x0 - 10, y0 - 60, full * k + 10, 90); ctx.clip();
    text(no, x0, y0, { family: LATIN, weight: 500, size: 26, spacing: 2, rgb: s.ink === 'light' ? AMBER : '140,92,52', alpha: .95, shadow });
    hair(x0 + wn + 22, y0 - 9, 36, s.ink === 'light' ? AMBER : '140,92,52', .9);
    text(zh, x0 + wn + 80, y0, { size: 28, weight: 600, spacing: 8, rgb, alpha: .94, shadow });
    text(en, x0 + wn + 80 + wz + 26, y0 - 1, { family: LATIN, weight: 500, size: 15, spacing: 7, rgb, alpha: .62, shadow });
    ctx.restore();
  }

  // 片尾：logo（模糊轉清晰＋微縮放）→ 細線 → 服務項目
  if (t > 27.9) {
    const k = easeOutCubic(win(t, 28.1, 29.0));
    const lw = 600, lh = lw * logo.height / logo.width;
    const sc = lerp(1.04, 1, easeOutExpo(win(t, 28.1, 29.2)));
    ctx.save();
    ctx.globalAlpha = k;
    const lb = (1 - k) * 12;
    if (lb > .05) ctx.filter = `blur(${lb}px)`;
    ctx.translate(W / 2, 452); ctx.scale(sc, sc);
    ctx.drawImage(logo, -lw / 2, -lh / 2, lw, lh);
    ctx.restore();
    hair(W / 2, 612, 56, AMBER, .85, 'center', easeOutExpo(win(t, 28.5, 29.2)));
    const v = win(t, 28.6, 29.2);
    text('家具訂製　·　空間合作　·　木作學堂', W / 2, 672, { size: 21, weight: 500, spacing: lerp(14, 8, easeOutExpo(v)), align: 'center', alpha: .72 * easeOutCubic(v), blur: (1 - easeOutCubic(v)) * 5 });
  }
}

/* ---------------- render ---------------- */
const audit = new Map(); // 每鏡最大有效放大倍率（螢幕 px / 原圖 px）
function renderFrame(t) {
  const s = shotAt(t);
  // 1. 鏡頭
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneT.fb);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.SCISSOR_TEST);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(PP.pr);
  gl.enable(gl.SCISSOR_TEST);
  gl.activeTexture(gl.TEXTURE0);
  gl.uniform1i(PP.u.uTex, 0);
  const light = s.light ? s.light(t) : [0, 1, 0, -1];
  for (const p of s.panels) {
    const st = panelState(s, p, t);
    const [rx, ry, rw, rh] = p.rect;
    gl.scissor(rx, H - ry - rh, rw, rh);
    gl.bindTexture(gl.TEXTURE_2D, p.asset.tex);
    gl.uniform2f(PP.u.uImg, p.asset.w, p.asset.h);
    gl.uniform4f(PP.u.uRect, rx, ry, rw, rh);
    gl.uniform2f(PP.u.uC, st.c[0], st.c[1]);
    gl.uniform1f(PP.u.uScale, st.sc);
    gl.uniform1f(PP.u.uRoll, st.roll);
    gl.uniform2f(PP.u.uShift, st.shift[0], st.shift[1]);
    gl.uniform2f(PP.u.uPar, st.par[0], st.par[1]);
    gl.uniform1f(PP.u.uDolly, st.dolly);
    gl.uniform4f(PP.u.uDepth, ...p.depth);
    gl.uniform4f(PP.u.uSub, ...p.sub);
    gl.uniform1f(PP.u.uFocus, st.focus);
    gl.uniform1f(PP.u.uAp, st.ap);
    gl.uniform1f(PP.u.uExpo, st.expo);
    gl.uniform1f(PP.u.uSharp, p.sharp);
    gl.uniform1f(PP.u.uBackdrop, p.backdrop ? 1 : 0);
    gl.uniform1f(PP.u.uRB, st.rb);
    gl.uniform2f(PP.u.uMB, st.mb[0], st.mb[1]);
    gl.uniform4f(PP.u.uLight, ...light);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    if (!p.backdrop) {
      const key = `b${s.b} ${p.img}`;
      audit.set(key, Math.max(audit.get(key) || 0, st.sc));
    }
  }
  gl.disable(gl.SCISSOR_TEST);
  // 2. bloom 亮部
  gl.bindFramebuffer(gl.FRAMEBUFFER, brightT.fb);
  gl.viewport(0, 0, W / 2, H / 2);
  gl.useProgram(PB.pr);
  gl.bindTexture(gl.TEXTURE_2D, sceneT.tex);
  gl.uniform1i(PB.u.uScene, 0);
  gl.uniform2f(PB.u.uRes, W / 2, H / 2);
  gl.uniform1f(PB.u.uThr, .68);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.bindTexture(gl.TEXTURE_2D, brightT.tex);
  gl.generateMipmap(gl.TEXTURE_2D);
  // 3. 字卡
  drawOverlay(t, s);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, overTex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, ov);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  // 4. 後製：bloom/halation、調色、光爆、暗角、黑邊、字卡、顆粒
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(PO.pr);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneT.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, brightT.tex);
  gl.uniform1i(PO.u.uScene, 0); gl.uniform1i(PO.u.uBright, 1); gl.uniform1i(PO.u.uOver, 2);
  gl.uniform1f(PO.u.uFrame, Math.round(t * FPS));
  gl.uniform1f(PO.u.uFlash, flashAt(t));
  gl.uniform1f(PO.u.uBars, barsAt(t));
  gl.uniform1f(PO.u.uFade, fadeAt(t));
  gl.uniform1f(PO.u.uBloom, bloomAt(t));
  gl.uniform1f(PO.u.uBurst, burstAt(t));
  gl.uniform2f(PO.u.uBurstPos, .74, .62);
  gl.uniform1f(PO.u.uCA, caAt(t, s));
  gl.uniform1f(PO.u.uTime, t);
  gl.uniform1f(PO.u.uGrain, .05);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.activeTexture(gl.TEXTURE0);
}

const pixels = new Uint8Array(W * H * 4), flipped = new Uint8Array(W * H * 4);
function readFrame() {
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  const row = W * 4;
  for (let y = 0; y < H; y++) flipped.set(pixels.subarray((H - 1 - y) * row, (H - y) * row), y * row);
  return flipped;
}

function report(msg) { return fetch('/log', { method: 'POST', body: String(msg) }).catch(() => {}); }

/* ---------------- modes ---------------- */
const hud = document.getElementById('hud');
if (params.has('render')) {
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  await report('GL ' + (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)));
  if (params.has('times')) {
    for (const ts of params.get('times').split(',')) {
      renderFrame(Number(ts));
      const r = await fetch('/frame?t=' + encodeURIComponent(ts), { method: 'POST', body: readFrame() });
      if (!r.ok) { await report('ERROR still ' + ts); return; }
    }
  } else {
    const total = Math.round(DURATION * FPS);
    for (let f = 0; f < total; f++) {
      renderFrame(f / FPS);
      const r = await fetch('/frame', { method: 'POST', body: readFrame() });
      if (!r.ok) { await report('ERROR frame ' + f); return; }
      if (f % 90 === 0) await report(`frame ${f}/${total}`);
    }
    await report('cuts ' + SHOTS.map((s) => `b${s.b}@${s.start.toFixed(3)}`).join(' '));
    await report('magnification ' + [...audit].map(([k, v]) => `${k}=${v.toFixed(3)}`).join(' | '));
  }
  await fetch('/done', { method: 'POST' });
} else if (params.has('t')) {
  renderFrame(Number(params.get('t')) || 0);
  hud.textContent = 't=' + params.get('t');
  document.title = 'ready';
} else {
  const audio = new Audio('audio/inspiring-cinematic-tunetank-409347.mp3');
  let start = performance.now(), playing = false;
  glCanvas.addEventListener('click', () => {
    audio.currentTime = AUDIO_START; audio.play(); playing = true;
  });
  const loop = (now) => {
    const t = playing ? Math.min(audio.currentTime - AUDIO_START, DURATION - .001) : ((now - start) / 1000) % DURATION;
    if (playing && audio.currentTime - AUDIO_START >= DURATION) audio.pause();
    renderFrame(Math.max(t, 0));
    hud.textContent = t.toFixed(2) + 's  b' + (t / BEAT).toFixed(1) + (playing ? '' : '  (click = play with music)');
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
})().catch((err) => {
  document.body.insertAdjacentHTML('beforeend', `<pre style="color:#f88;position:fixed;top:0">${err.stack}</pre>`);
  fetch('/log', { method: 'POST', body: 'ERROR ' + err.stack }).catch(() => {});
});
</script>
