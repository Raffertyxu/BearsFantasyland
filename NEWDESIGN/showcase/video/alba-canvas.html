<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飛熊入夢｜晨露圓境 圓萃托盤 30 秒廣告片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #out{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;aspect-ratio:16/9}
  #hud{position:fixed;left:8px;bottom:8px;font:12px monospace;color:#888}
</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<div id="hud"></div>
<script>
(async () => {
'use strict';
/*
  晨露圓境 Alba Canvas・圓萃托盤 30 秒商品廣告片（電影寬銀幕 2.39:1、暗場棚拍）。
  ?t=12.3  顯示單一畫格   ?render  逐格送給 render.mjs 編碼   無參數  即時預覽
  素材：prep_trays.py 產生的 trays/tray-NN-a.webp（去背）與 trays.json（托盤外框）。
  配樂：score.py 依同一份拍點合成，render.mjs --audio 混入。改拍點時兩邊一起改。
  字卡一律不加標點。
*/
const W = 1920, H = 1080, FPS = 30, DURATION = 30;
const BAR = 138;                         // 2.39:1 上下黑邊
const TOP = BAR, BOT = H - BAR, MID = H / 2;
const params = new URLSearchParams(location.search);

/* 拍點（120 BPM，一拍 0.5 秒）
   0–2   暗場，光束掃過竹款側面剪影
   2     重擊｜竹紋特寫，移軸景深
   4–6   托盤從側面翻正並旋轉，地面倒影，背景巨字 ALBA CANVAS
   6     重擊＋閃白｜品名
   8     甩鏡進場｜大地褐木紋橫移，9 秒急拉遠
   10    分件收納：每拍一個機位跳切（10 / 10.5 / 11）
   12–14 側面輪廓推軌，光束掃過，蓄勢上升音
   14–15 八款每 1/8 拍頻閃，14.875 靜默
   15–19 drop：每拍一色，托盤旋入、背景巨大色名
   19–22 八款橫向陳列，鏡頭平移
   22 / 24 標語兩句各落在小節第一拍
   26    重擊｜片尾 Logo，30 秒淡出 */
const HITS = [[2, 1], [6, 1.3], [10, .5], [10.5, .5], [11, .5], [15, 1], [15.5, .45], [16, .45], [16.5, .45], [17, .6], [17.5, .45], [18, .45], [18.5, .45], [22, 1], [26, 1.2]];
const FLASHES = [6, 10, 10.5, 11, 15, 22];

/* ---------------- assets ---------------- */
const loadImage = (src) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('load ' + src)); im.src = src; });
const META = await (await fetch('trays/trays.json')).json();
const CUT = {};
await Promise.all(Object.keys(META).map(async (k) => { CUT[k] = await loadImage(`trays/${k}-a.webp`); }));
const logoImg = await loadImage('../../website/public/logo-transparent.png');
const logo = document.createElement('canvas');
logo.width = logoImg.naturalWidth; logo.height = logoImg.naturalHeight;
{ const c = logo.getContext('2d'); c.drawImage(logoImg, 0, 0); c.globalCompositeOperation = 'source-in'; c.fillStyle = '#f5f2ec'; c.fillRect(0, 0, logo.width, logo.height); }

const SANS = '"Inter", "Noto Sans TC", sans-serif';
const ALL_TEXT = '竹的細緻清雅晨露圓境圓萃托盤木色拼接不同交錯保留材自然紋理分件收納與底座使用弧輪廓形邊框淺盤面八款調大地褐山嵐青霧白朝霞紅暮靛藍玄墨一器承日常納天讓走進每活飛熊入夢ALBACANVSROUNDTRYLIFESTYLEWOODK0123456789/';
await Promise.all([400, 500, 700, 900].map((w) => document.fonts.load(`${w} 80px ${SANS}`, ALL_TEXT)));

/* ---------------- easing ---------------- */
const clamp01 = (x) => Math.min(Math.max(x, 0), 1);
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp01((t - a) / (b - a));
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let u = x;
    for (let i = 0; i < 8; i++) { const d = (3 * ax * u + 2 * bx) * u + cx; u -= (((ax * u + bx) * u + cx) * u - x) / (d || 1e-6); u = clamp01(u); }
    return ((ay * u + by) * u + cy) * u;
  };
}
const MOVE = bezier(.65, 0, .35, 1);
const ENTER = bezier(.16, 1, .3, 1);
const SNAP = bezier(.9, 0, .1, 1);      // 急拉、甩鏡：前後都很慢、中間極快
const EXIT = bezier(.7, 0, .84, 0);
const logLerp = (a, b, t) => Math.exp(lerp(Math.log(a), Math.log(b), t));
const rand = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

/* ---------------- canvases ---------------- */
const out = document.getElementById('out');
const ctx = out.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const bufA = mk(), bufB = mk();
function layer(buf, fn) {
  const c = buf.getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; c.filter = 'none';
  c.clearRect(0, 0, W, H); fn(c); return buf;
}

/* ---------------- primitives ---------------- */
// 托盤：外框中心放在 (cx, cy)，外框寬 d；sy < 1 時把盤面壓扁＝往鏡頭方向傾倒的透視感
function tray(c, name, cx, cy, d, o = {}) {
  const m = META[name], [x0, y0, x1, y1] = m.box;
  const s = d / ((x1 - x0) * m.w);
  c.save();
  c.globalAlpha = o.alpha ?? 1;
  if (o.filter) c.filter = o.filter;
  c.translate(cx, cy); c.scale(1, o.sy ?? 1); c.rotate(o.rot || 0); c.scale(s, s);
  c.drawImage(CUT[name], -(x0 + x1) / 2 * m.w, -(y0 + y1) / 2 * m.h);
  c.restore();
}
const trayH = (name, d) => { const m = META[name], [x0, y0, x1, y1] = m.box; return d * ((y1 - y0) * m.h) / ((x1 - x0) * m.w); };

// 地面倒影：以 floorY 為鏡面翻轉，往下漸隱
function reflect(fn, floorY, strength = .28, len = 260) {
  const b = layer(bufA, (c) => { c.translate(0, 2 * floorY); c.scale(1, -1); fn(c); });
  const c = b.getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'destination-in';
  const g = c.createLinearGradient(0, floorY, 0, floorY + len);
  g.addColorStop(0, `rgba(0,0,0,${strength})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  ctx.drawImage(b, 0, 0);
}
// 光束：fn 畫出亮版，只在斜向光帶內顯示
function sweep(fn, x, width = 380, angle = .35, alpha = 1) {
  const b = layer(bufB, fn);
  const c = b.getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'destination-in';
  c.translate(x, MID); c.rotate(angle);
  const g = c.createLinearGradient(-width / 2, 0, width / 2, 0);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, `rgba(0,0,0,${alpha})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(-width / 2, -H * 1.5, width, H * 3);
  ctx.drawImage(b, 0, 0);
}
// 移軸景深：focusY 附近清楚，上下逐漸模糊
function tiltShift(fn, focusY, band, blur) {
  const a = layer(bufA, fn);
  ctx.drawImage(a, 0, 0);
  const b = layer(bufB, (c) => { c.filter = `blur(${blur}px)`; c.drawImage(a, 0, 0); });
  const c = b.getContext('2d');
  c.filter = 'none'; c.globalCompositeOperation = 'destination-out';
  const g = c.createLinearGradient(0, focusY - band * 2.2, 0, focusY + band * 2.2);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.38, 'rgba(0,0,0,1)'); g.addColorStop(.62, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  ctx.drawImage(b, 0, 0);
}
// 暗場棚拍背景：聚光燈打在 (x, y)
function studio(x = W / 2, y = MID, color = '#3a2f26', base = '#050505', r = 900) {
  ctx.fillStyle = base; ctx.fillRect(-100, -100, W + 200, H + 200);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, base);
  ctx.fillStyle = g; ctx.fillRect(-100, -100, W + 200, H + 200);
}
// 變形鏡頭橫向光暈
function streak(x, y, k, color = '255,214,170', len = 1400) {
  if (k <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createLinearGradient(x - len / 2, 0, x + len / 2, 0);
  g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(.5, `rgba(${color},${.85 * k})`); g.addColorStop(1, `rgba(${color},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - len / 2, y - 2, len, 4);
  const r = ctx.createRadialGradient(x, y, 0, x, y, 160);
  r.addColorStop(0, `rgba(${color},${.55 * k})`); r.addColorStop(1, `rgba(${color},0)`);
  ctx.fillStyle = r; ctx.fillRect(x - 160, y - 160, 320, 320);
  ctx.restore();
}
// 漂浮微塵（散景光點）
function dust(t, n = 40, alpha = .5) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const z = .3 + rand(i * 3) * .7;
    const x = ((rand(i) * W + t * 28 * z) % (W + 200)) - 100;
    const y = TOP + ((rand(i * 7) * (BOT - TOP) - t * 14 * z) % (BOT - TOP) + (BOT - TOP)) % (BOT - TOP);
    const r = 2 + z * 9;
    const a = alpha * (.25 + .75 * rand(i * 11)) * (.6 + .4 * Math.sin(t * 2 + i));
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(255,226,190,${a})`); g.addColorStop(1, 'rgba(255,226,190,0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  ctx.restore();
}

// 字卡：進場上浮＋去模糊，退場淡出並微微放大
function text(str, x, y, t, tin, tout, o = {}) {
  if (t < tin || (tout != null && t > tout + .3)) return;
  const ein = ENTER(prog(t, tin, tin + (o.dur || .7)));
  const eout = tout != null ? EXIT(prog(t, tout, tout + .3)) : 0;
  const a = ein * (1 - eout);
  if (a <= 0) return;
  const size = o.size || 80;
  ctx.save();
  ctx.globalAlpha = a * (o.alpha ?? 1);
  ctx.font = `${o.weight || 700} ${size}px ${SANS}`;
  ctx.letterSpacing = (o.tracking ?? 0) * size + 'px';
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'alphabetic';
  const blur = (1 - ein) * (o.blur ?? 16) + eout * 8;
  if (blur > .3) ctx.filter = `blur(${blur.toFixed(1)}px)`;
  ctx.fillStyle = o.color || '#f5f2ec';
  const sc = 1 + eout * .04 + (o.grow ? (t - tin) * o.grow : 0);
  ctx.translate(x, y + (1 - ein) * (o.rise ?? 30)); ctx.scale(sc, sc);
  ctx.fillText(str, 0, 0);
  ctx.restore();
}
const GREY = 'rgba(245,242,236,.62)', AMBER = '#d9a46a';

/* ---------------- 八款 ---------------- */
const COLORS = [
  { img:'tray-01', name:'大地褐', bg:'#7a4526', base:'#1d0e06' },
  { img:'tray-02', name:'山嵐青', bg:'#2f6a7a', base:'#071c22' },
  { img:'tray-05', name:'晨霧白', bg:'#8c97a3', base:'#20262d' },
  { img:'tray-06', name:'晨露青', bg:'#2a8494', base:'#062429' },
  { img:'tray-08', name:'朝霞紅', bg:'#c8392b', base:'#3a0805' },
  { img:'tray-07', name:'暮靛藍', bg:'#2457b0', base:'#050f2b' },
  { img:'tray-09', name:'玄墨', bg:'#5a5a5e', base:'#060606' },
  { img:'tray-13', name:'竹款', bg:'#a87530', base:'#2a1704' }
];

/* ---------------- scenes ---------------- */
function s1Silhouette(t) { // 0–2：暗場，光束掃過側面
  studio(W / 2, MID + 40, '#120e0b', '#020202', 900);
  const d = lerp(1500, 1620, prog(t, 0, 2));
  const draw = (c, f) => tray(c, 'tray-11', W / 2, MID + 60, d, { filter:f });
  draw(ctx, 'brightness(.12)');
  const x = lerp(-300, W + 300, MOVE(prog(t, .2, 1.95)));
  sweep((c) => draw(c, 'brightness(1.25) saturate(1.1)'), x, 520, .3);
  streak(x, MID + 60 - trayH('tray-11', d) / 2 + 6, Math.sin(Math.PI * prog(t, .2, 1.95)) * .9);
  text('LIFESTYLE WOODWORK', W / 2, TOP + 120, t, .7, 1.7, { size:24, weight:500, color:GREY, tracking:.5, blur:8 });
}

function s2Macro(t) { // 2–4：竹紋特寫，移軸景深
  studio(W / 2, MID, '#1a120a', '#050403', 1000);
  const k = prog(t, 2, 4);
  tiltShift((c) => tray(c, 'tray-13', W / 2 + 300 - k * 200, MID + 380, 2600, { rot:-.5 + k * .12 }), MID + 20, 140, 12);
  text('竹的細緻清雅', 160, MID + 30, t, 2.5, 3.75, { size:84, weight:700, align:'left' });
  text('木的溫潤厚實', 160, MID + 120, t, 3.0, 3.75, { size:84, weight:700, align:'left', color:AMBER });
}

function s3Orbit(t) { // 4–8：托盤翻正旋轉＋品名
  studio(W / 2, MID - 60, '#3a2c1e', '#050404', 1100);
  const k = prog(t, 4, 8);
  const tilt = MOVE(prog(t, 4, 6.2));
  const sy = lerp(.16, .62, tilt);
  const d = lerp(880, 760, MOVE(prog(t, 5.6, 7)));
  const cy = lerp(MID + 40, MID - 70, MOVE(prog(t, 5.6, 7)));
  const rot = 2.2 * (1 - ENTER(prog(t, 4, 7))) + t * .05;
  // 背景巨字
  ctx.save(); ctx.globalAlpha = .07 * ENTER(prog(t, 4.3, 5.5));
  ctx.font = `900 300px ${SANS}`; ctx.letterSpacing = '20px'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.fillText('ALBA CANVAS', W / 2 + 160 - k * 320, MID + 105); ctx.restore();
  const floor = cy + trayH('tray-13', d) * sy / 2;
  reflect((c) => tray(c, 'tray-13', W / 2, cy, d, { sy, rot }), floor, .22, 220);
  tray(ctx, 'tray-13', W / 2, cy, d, { sy, rot });
  sweep((c) => tray(c, 'tray-13', W / 2, cy, d, { sy, rot, filter:'brightness(1.7)' }), lerp(-200, W + 200, prog(t, 4.4, 5.9)), 300, .5, .55);
  text('晨露圓境', W / 2, BOT - 140, t, 6, 7.7, { size:132, weight:900, tracking:.04, grow:.012 });
  text('圓萃托盤   ALBA CANVAS ROUND TRAY', W / 2, BOT - 70, t, 6.5, 7.7, { size:28, weight:500, color:GREY, tracking:.18 });
}

function s4Material(t) { // 8–10：甩鏡進場，大地褐橫移後急拉遠
  studio(W * .64, MID, '#3a2112', '#060302', 1000);
  const pull = SNAP(prog(t, 8.9, 9.5));
  const d = logLerp(2600, 720, pull);
  const cx = lerp(W / 2 + 500 - prog(t, 8, 9) * 700, W * .66, pull);
  const cy = lerp(MID + 60, MID + 10, pull);
  // 甩鏡：進場 0.3 秒內多重影像＝動態模糊
  const whip = 1 - prog(t, 8, 8.3);
  if (whip > 0) {
    for (let i = 0; i < 10; i++) tray(ctx, 'tray-01', cx + (i / 9) * 900 * whip * whip, cy, d, { alpha:.18 });
  } else tray(ctx, 'tray-01', cx, cy, d, { rot:.05 * (1 - pull) });
  if (pull > .98) sweep((c) => tray(c, 'tray-01', cx, cy, d, { filter:'brightness(1.6)' }), lerp(W * .4, W * .95, prog(t, 9.4, 10)), 260, .4, .6);
  text('木色拼接', 160, MID - 10, t, 9.3, 9.8, { size:110, weight:900, align:'left' });
  text('不同木色交錯', 160, MID + 70, t, 9.45, 9.8, { size:36, weight:500, align:'left', color:GREY });
  text('保留木材自然紋理', 160, MID + 122, t, 9.45, 9.8, { size:36, weight:500, align:'left', color:GREY });
}

function s5Split(t) { // 10–12：每拍跳一個機位
  const shots = [
    { img:'tray-02', d:760, x:W / 2, y:MID + 20, rot:-.08, light:[W / 2, MID] },
    { img:'tray-04', d:1150, x:W / 2 + 260, y:MID + 120, rot:.12, light:[W * .62, MID + 80] },
    { img:'tray-03', d:760, x:W / 2 + 120, y:MID + 110, rot:-.04, light:[W * .55, MID + 60] }
  ];
  const i = Math.min(2, Math.floor((t - 10) / .5));
  const s = shots[i];
  studio(s.light[0], s.light[1], '#1d3b44', '#030708', 1000);
  const local = t - 10 - i * .5;
  const push = 1 + local * .05;
  tray(ctx, s.img, s.x, s.y, s.d * push, { rot:s.rot + local * .03 });
  text('分件收納', W / 2, TOP + 150, t, 11, 11.75, { size:110, weight:900 });
  text('托盤與底座分件使用', W / 2, TOP + 215, t, 11.15, 11.75, { size:34, weight:500, color:GREY, tracking:.06 });
}

function s6Profile(t) { // 12–14：側面推軌＋光束
  studio(W / 2, MID + 120, '#2a2016', '#040303', 1100);
  const k = prog(t, 12, 14);
  const d = lerp(1250, 1500, MOVE(k));
  const cy = MID + 120;
  const cx = lerp(W / 2 + 120, W / 2 - 60, k);
  const floor = cy + trayH('tray-11', d) / 2 - 8;
  reflect((c) => tray(c, 'tray-11', cx, cy, d), floor, .3, 160);
  tray(ctx, 'tray-11', cx, cy, d);
  sweep((c) => tray(c, 'tray-11', cx, cy, d, { filter:'brightness(1.8)' }), lerp(-300, W + 300, prog(t, 12.3, 13.9)), 340, .2, .7);
  text('圓弧輪廓', W / 2, TOP + 160, t, 12.5, 13.75, { size:110, weight:900 });
  text('圓形邊框與淺盤面', W / 2, TOP + 225, t, 12.75, 13.75, { size:34, weight:500, color:GREY, tracking:.06 });
}

function s7Strobe(t) { // 14–15：1/8 拍頻閃，最後一拍靜默
  if (t >= 14.875) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); return; }
  const i = Math.floor((t - 14) / .125);
  const c = COLORS[i % 8];
  studio(W / 2, MID, c.bg, c.base, 900);
  tray(ctx, c.img, W / 2, MID, 420 + i * 30, { rot:i * .4, filter:'brightness(.45)' });
  text('八款色調', W / 2, MID + 60, t, 14.25, null, { size:200 + (t - 14) * 40, weight:900, dur:.2, blur:0, rise:0 });
}

function s8Drop(t) { // 15–19：每拍一色
  const i = Math.min(7, Math.floor((t - 15) / .5));
  const c = COLORS[i];
  const local = t - 15 - i * .5;
  studio(W / 2, MID, c.bg, c.base, 1050);
  // 背景巨大色名（被托盤壓在後面）
  ctx.save(); ctx.globalAlpha = .16; ctx.font = `900 ${c.name.length > 2 ? 400 : 480}px ${SANS}`; ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.fillText(c.name, W / 2 + (i % 2 ? -1 : 1) * local * 120, MID + 150); ctx.restore();
  const e = ENTER(clamp01(local / .45));
  const d = 600 * lerp(1.28, 1, e) * (1 + local * .04);
  const rot = (i % 2 ? 1 : -1) * .9 * (1 - e);
  const floor = MID + trayH(c.img, d) / 2 + 10;
  reflect((cc) => tray(cc, c.img, W / 2, MID, d, { rot }), floor, .25, 150);
  tray(ctx, c.img, W / 2, MID, d, { rot });
  text(c.name, W / 2, BOT - 40, t, 15 + i * .5, null, { size:44, weight:700, tracking:.2, dur:.25, blur:6, rise:14 });
  ctx.save(); ctx.font = `500 20px ${SANS}`; ctx.fillStyle = GREY; ctx.letterSpacing = '6px'; ctx.textAlign = 'right';
  ctx.fillText(`0${i + 1} / 08`, W - 120, TOP + 70); ctx.restore();
}

function s9Lineup(t) { // 19–22：橫向陳列＋平移
  studio(W / 2, MID - 40, '#2b241d', '#040404', 1300);
  const k = prog(t, 19, 22);
  const off = lerp(700, -700, MOVE(k));
  const zoom = lerp(1.25, .95, MOVE(prog(t, 19, 20.4)));
  const floorY = MID + 120;
  const all = (c) => COLORS.forEach((col, i) => {
    const x = W / 2 + (i - 3.5) * 470 * zoom + off;
    const d = 380 * zoom;
    const sy = .62;
    tray(c, col.img, x, floorY - trayH(col.img, d) * sy / 2, d, { sy, rot:t * .15 + i });
  });
  reflect(all, floorY, .25, 200);
  all(ctx);
  COLORS.forEach((col, i) => {
    const x = W / 2 + (i - 3.5) * 470 * zoom + off;
    text(col.name, x, floorY + 120, t, 19.6 + i * .0625, 21.6, { size:28, weight:500, color:GREY, tracking:.15, blur:6, rise:12 });
  });
  dust(t, 30, .35);
}

function s10Slogan(t) { // 22–26：標語
  studio(W / 2, BOT, '#3a2a18', '#030302', 1100);
  const e = MOVE(prog(t, 22, 23.6));
  const d = 1300;
  const cy = lerp(BOT + 420, BOT + 160, e);
  tray(ctx, 'tray-12', W / 2, cy, d, { rot:(t - 22) * .02 });
  sweep((c) => tray(c, 'tray-12', W / 2, cy, d, { rot:(t - 22) * .02, filter:'brightness(1.6)' }), lerp(-200, W + 200, prog(t, 22.2, 25.6)), 400, .4, .6);
  dust(t, 45, .55);
  text('一器承日常', W / 2, MID - 40, t, 22, 23.7, { size:130, weight:900, tracking:.06, grow:.01 });
  text('一圓納天地', W / 2, MID - 40, t, 24, 25.7, { size:130, weight:900, tracking:.06, grow:.01 });
}

function s11End(t) { // 26–30：片尾
  studio(W / 2, MID - 120, '#2a2016', '#030303', 1000);
  tray(ctx, 'tray-13', W / 2, MID - 140, 300, { sy:.55, rot:t * .3, alpha:ENTER(prog(t, 26, 27)) });
  const k = ENTER(prog(t, 26.4, 27.6));
  const lw = 420, lh = lw * logo.height / logo.width;
  ctx.save(); ctx.globalAlpha = k; ctx.translate(W / 2, MID + 40); const s = lerp(.92, 1, k); ctx.scale(s, s);
  ctx.drawImage(logo, -lw / 2, -lh / 2, lw, lh); ctx.restore();
  text('晨露圓境   圓萃托盤', W / 2, MID + 175, t, 27, null, { size:40, weight:700, tracking:.12 });
  text('讓木作走進每一天的生活', W / 2, MID + 230, t, 27.5, null, { size:26, weight:500, color:GREY, tracking:.2 });
  dust(t, 25, .3);
}

const SCENES = [
  [0, 2, s1Silhouette], [2, 4, s2Macro], [4, 8, s3Orbit], [8, 10, s4Material], [10, 12, s5Split],
  [12, 14, s6Profile], [14, 15, s7Strobe], [15, 19, s8Drop], [19, 22, s9Lineup], [22, 26, s10Slogan], [26, 30, s11End]
];

function shake(t) {
  let x = 0, y = 0;
  for (const [at, amp] of HITS) {
    const u = t - at;
    if (u < 0 || u > .5) continue;
    const k = amp * Math.exp(-u * 9) * 14;
    x += Math.sin(u * 90 + at) * k; y += Math.cos(u * 73 + at * 2) * k;
  }
  return [x, y];
}

function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const [sx, sy] = shake(t);
  ctx.save();
  ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(1.02, 1.02); ctx.translate(-W / 2, -H / 2);
  const sc = SCENES.find(([a, b]) => t >= a && t < b) || SCENES[SCENES.length - 1];
  sc[2](t);
  ctx.restore();
  // 閃白
  for (const f of FLASHES) {
    const u = t - f;
    if (u >= 0 && u < .25) { ctx.fillStyle = `rgba(255,250,240,${.85 * Math.exp(-u * 14)})`; ctx.fillRect(0, 0, W, H); }
  }
  // 開場淡入、結尾淡出
  const black = Math.max(1 - prog(t, 0, .4), prog(t, DURATION - 1.2, DURATION));
  if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, BAR); ctx.fillRect(0, BOT, W, BAR);
}

function report(msg) { return fetch('/log', { method:'POST', body:String(msg) }).catch(() => {}); }

/* ---------------- modes ---------------- */
const hud = document.getElementById('hud');
if (params.has('render')) {
  const total = Math.round(DURATION * FPS);
  for (let f = 0; f < total; f++) {
    renderFrame(f / FPS);
    const data = ctx.getImageData(0, 0, W, H).data;
    const r = await fetch('/frame', { method:'POST', body:data.buffer });
    if (!r.ok) { await report('ERROR frame ' + f); return; }
    if (f % 30 === 0) await report(`frame ${f}/${total}`);
  }
  await fetch('/done', { method:'POST' });
} else if (params.has('t')) {
  renderFrame(Number(params.get('t')) || 0);
  hud.textContent = 't=' + params.get('t');
  document.title = 'ready';
} else {
  const start = performance.now();
  const loop = (now) => {
    const t = ((now - start) / 1000) % DURATION;
    renderFrame(t);
    hud.textContent = t.toFixed(2) + 's';
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
})().catch((err) => {
  document.body.insertAdjacentHTML('beforeend', `<pre style="color:#f88;position:fixed;top:0">${err.stack}</pre>`);
  fetch('/log', { method:'POST', body:'ERROR ' + err.stack }).catch(() => {});
});
</script>
