(async () => {
'use strict';
/*
  30 秒家具作品影片。
  ?t=12.3  顯示單一畫格   ?render  逐格送給 render.mjs 編碼   無參數  即時預覽

*/
const W = 1920, H = 1080, FPS = 30, DURATION = 30;
const BASE = '../../website/assets/works/';
const params = new URLSearchParams(location.search);

// fx: 0 木紋燃痕 1 漣漪 2 木條切片 3 推鏡 4 墨韻 5 色散 6 甩鏡 7 漏光 8 開門
// layout: 0 滿版 1 畫框（直幅照片） 2 片尾模糊
// cam: [zoom0, zoom1], focus [[x0,y0],[x1,y1]]（影像座標，y 向下）, rot [r0, r1]
const SHOTS = [
  { img:'muju/04.webp', at:0, layout:0, z:[1.45,1.15], f:[[.62,.5],[.45,.45]], r:[.015,-.004], intro:true },
  { img:'ridge-table/01.webp', at:2.5, fx:0, d:1.0, z:[1.08,1.22], f:[[.3,.62],[.62,.55]], r:[0,0], work:0 },
  { img:'landscape-table/01.webp', at:4.5, fx:7, d:.8, z:[1.24,1.06], f:[[.5,.35],[.52,.62]], r:[0,0], work:1 },
  { img:'muju/01.webp', at:6.5, fx:4, d:.9, z:[1.1,1.25], f:[[.7,.4],[.4,.6]], r:[0,0], work:2 },
  { img:'musu/01.webp', at:8, fx:6, d:.5, z:[1.2,1.1], f:[[.15,.5],[.8,.5]], r:[0,0], work:3 },
  { img:'muyo/01.webp', at:9.5, fx:2, d:.7, z:[1.3,1.08], f:[[.5,.28],[.5,.6]], r:[-.01,.008], work:4 },
  { img:'muwi/01.webp', at:11, fx:3, d:.6, z:[1.06,1.3], f:[[.5,.55],[.52,.5]], r:[0,0], work:5 },
  { img:'muki/01.webp', at:12.5, fx:5, d:.6, z:[1.15,1.15], f:[[.2,.4],[.75,.6]], r:[0,0], work:6 },
  { img:'muni/01.webp', at:14, fx:8, d:.6, layout:1, z:[1.0,1.12], f:[[.5,.5],[.5,.45]], r:[0,0], work:7 },
  { img:'ripple/01.webp', at:15.5, fx:1, d:1.0, z:[1.36,1.1], f:[[.5,.4],[.45,.45]], r:[.03,0], work:8 },
  { img:'warm/05.webp', at:17.5, fx:3, d:.6, z:[1.1,1.3], f:[[.4,.4],[.55,.45]], r:[0,0], work:9 },
  { img:'walnut-island-bar/01.webp', at:19, fx:0, d:.8, z:[1.15,1.05], f:[[.8,.5],[.25,.5]], r:[0,0], work:10 },
  { img:'cherry-island-table/02.webp', at:20.5, fx:5, d:.6, z:[1.08,1.25], f:[[.3,.4],[.62,.5]], r:[0,0], work:11 },
  { img:'grid/01.webp', at:22, fx:4, d:.8, layout:1, z:[1.02,1.15], f:[[.5,.5],[.5,.4]], r:[0,0], work:12 },
  { img:'ridge-shelf/03.webp', at:23, fx:6, d:.4, z:[1.25,1.1], f:[[.5,.15],[.5,.75]], r:[0,0], work:13 },
  { img:'arch/01.webp', at:24, fx:2, d:.5, layout:1, z:[1.0,1.1], f:[[.5,.2],[.5,.8]], r:[0,0], work:14 },
  { img:'plain/01.webp', at:25, fx:8, d:.45, z:[1.1,1.22], f:[[.5,.5],[.5,.5]], r:[0,0], work:15 },
  { img:'breeze/01.webp', at:26, fx:6, d:.4, layout:1, z:[1.12,1.0], f:[[.5,.5],[.5,.5]], r:[0,0], work:16 },
  { img:'ridge-table/01.webp', at:27, fx:7, d:1.0, layout:2, z:[1.1,1.18], f:[[.5,.55],[.5,.5]], r:[0,0], outro:true }
];
const WORKS = [
  ['稜','RIDGE','栓木實木','桌／餐桌',0], ['原木景觀桌','LANDSCAPE TABLE','實木','桌／餐桌',0],
  ['木聚','MUJU','栓木','桌／餐桌',1], ['木序','MUSU','硬楓木','長桌／餐桌',1], ['木韻','MUYO','胡桃木','餐桌椅組',1],
  ['木翼','MUWI','胡桃木','長桌／餐桌',1], ['木境','MUKI','實木','日式風格桌',1], ['木日','MUNI','實木','居家生活桌',1],
  ['漾','RIPPLE','多樹種拼木','圓椅／高腳椅',2], ['暖','WARM','實木','圓凳',2],
  ['胡桃木中島酒櫃','WALNUT ISLAND BAR','胡桃木','中島／酒櫃',3], ['櫻桃木中島桌','CHERRY ISLAND','櫻桃木','中島桌／階梯桌',3],
  ['格','GRID','實木','收納櫃',4], ['嶺','RIDGE SHELF','實木','層架',4], ['築','ARCH','檜木','大型收納櫃',4],
  ['原','PLAIN','實木','書架／層架',4], ['風','BREEZE','實木','百葉收納櫃',4]
];
const SERIES = [
  ['自然地景系列','LANDSCAPE COLLECTION'], ['MU 木生活系列','MU COLLECTION'], ['椅凳系列','SEATING'],
  ['中島・生活機能系列','KITCHEN ISLAND'], ['櫃子・書架系列','STORAGE']
];
const WORKS_START = 2.5, WORKS_END = 27;

/* ---------------- WebGL2 ---------------- */
const glCanvas = document.getElementById('gl');
const gl = glCanvas.getContext('webgl2', { antialias:false, preserveDrawingBuffer:true, premultipliedAlpha:false });
if (!gl) { document.body.textContent = 'WebGL2 not available'; report('ERROR no webgl2'); return; }

const VERT = `#version 300 es
in vec2 p; out vec2 vUv; void main(){ vUv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;
const FRAG = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uT0, uT1;
uniform vec2 uRes, uS0, uS1;
uniform vec4 uC0, uC1;
uniform float uL0, uL1, uP, uTime;
uniform int uFx;
#define PI 3.14159265
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}
float ease(float t){return t<.5?4.*t*t*t:1.-pow(-2.*t+2.,3.)/2.;}
float sweep(float v,float p,float e){return smoothstep(v,v+e,p*(1.+e));}

vec2 coverUV(vec2 uv, vec2 img, vec4 c, vec2 res){
  float ra=res.x/res.y, ia=img.x/img.y;
  vec2 s = ra>ia ? vec2(1., ia/ra) : vec2(ra/ia, 1.);
  s /= c.x;
  vec2 q = uv-.5; q.x *= ra;
  float cs=cos(c.w), sn=sin(c.w); q = mat2(cs,-sn,sn,cs)*q; q.x /= ra;
  vec2 room = 1.-s;
  return (q+.5)*s + room*c.yz;
}
vec4 layer(sampler2D t, vec2 img, vec4 c, float L, vec2 uv){
  if(L<.5) return texture(t, coverUV(uv,img,c,uRes));
  if(L<1.5){
    vec4 bg = textureLod(t, coverUV(uv,img,vec4(1.2,.5,.5,0.),uRes), 5.5);
    bg.rgb *= .42;
    float h=.8; float w=h*(img.x/img.y)/(uRes.x/uRes.y);
    vec2 ctr=vec2(.68,.5);
    vec2 q=(uv-ctr)/vec2(w,h)+.5;
    if(q.x>=0.&&q.x<=1.&&q.y>=0.&&q.y<=1.) return texture(t, coverUV(q,img,c,vec2(w*uRes.x,h*uRes.y)));
    vec2 dq=max(abs(uv-ctr)-vec2(w,h)*.5,0.);
    float sh=exp(-length(dq*vec2(uRes.x/uRes.y,1.))*28.);
    bg.rgb *= 1.-.55*sh;
    return bg;
  }
  vec4 b = textureLod(t, coverUV(uv,img,c,uRes), 3.2);
  b.rgb *= .3;
  return b;
}
vec4 A(vec2 uv){return layer(uT0,uS0,uC0,uL0,uv);}
vec4 B(vec2 uv){return layer(uT1,uS1,uC1,uL1,uv);}

void main(){
  vec2 uv=vUv; float p=uP; float ra=uRes.x/uRes.y; float s=sin(p*PI);
  vec4 col;
  if(p<=0.){ col=A(uv); }
  else if(p>=1.){ col=B(uv); }
  else if(uFx==0){ // 木紋燃痕
    float g=fbm(vec2(uv.x*2.2,uv.y*22.+fbm(uv*3.)*4.));
    float v=clamp(uv.x*.62+g*.38,0.,1.);
    float m=sweep(v,p,.08); float edge=1.-abs(m*2.-1.);
    vec2 d=vec2(0.,(g-.5)*.05*edge);
    col=mix(A(uv+d),B(uv-d),m);
    col.rgb+=vec3(1.,.6,.26)*pow(edge,3.)*.65;
  } else if(uFx==1){ // 漣漪
    vec2 q=(uv-.5)*vec2(ra,1.); float dist=length(q);
    float maxR=length(vec2(ra,1.))*.5; float r=p*(maxR+.3);
    float band=smoothstep(.28,0.,abs(dist-r))*s;
    vec2 dir=dist>0.?q/dist:vec2(0.);
    float w=sin(dist*38.-p*26.)*.02*band+sin(dist*12.-p*9.)*.012*s;
    vec2 off=dir*w/vec2(ra,1.);
    float m=1.-smoothstep(r-.14,r+.02,dist);
    col=mix(A(uv+off),B(uv-off*1.4),m);
    col.rgb+=vec3(1.,.9,.75)*band*.08;
  } else if(uFx==2){ // 木條切片
    float n=7.; float id=floor(uv.x*n); float fx=fract(uv.x*n);
    float delay=id/(n-1.)*.42; float lp=ease(clamp((p-delay)/.58,0.,1.));
    float m=step(1.-lp,uv.y);
    vec4 a=A(vec2(uv.x,uv.y+lp*.25)); a.rgb*=1.-.4*lp;
    vec4 b=B(vec2(uv.x,uv.y-(1.-lp)*.35)); b.rgb*=mix(.7,1.,lp);
    col=mix(a,b,m);
    float line=smoothstep(.004,0.,abs(uv.y-(1.-lp)))*step(.001,lp)*step(lp,.999);
    col.rgb+=vec3(1.,.82,.6)*line*.8;
    col.rgb*=1.-smoothstep(.985,1.,fx)*.35*s;
  } else if(uFx==3){ // 推鏡光爆
    vec2 c=vec2(.5); vec4 a=vec4(0.), b=vec4(0.);
    for(int i=0;i<16;i++){ float t=float(i)/15.; float k=1.-t*.16*s;
      a+=A(c+(uv-c)*(1.-p*.3)*k); b+=B(c+(uv-c)*(1.-(1.-p)*.3)*k); }
    col=mix(a/16.,b/16.,smoothstep(.38,.62,p));
    col.rgb+=vec3(1.,.84,.62)*pow(s,5.)*.28;
  } else if(uFx==4){ // 墨韻煙幕
    float n=fbm(uv*vec2(ra,1.)*2.4+vec2(0.,p*.7));
    float v=clamp((uv.x*.55+(1.-uv.y)*.45)*.7+n*.3,0.,1.);
    float m=sweep(v,p,.2); float edge=1.-abs(m*2.-1.);
    vec2 d=(vec2(n)-.5)*.07*edge;
    col=mix(A(uv+d),B(uv-d*.5),m);
    col.rgb*=1.-edge*.5;
  } else if(uFx==5){ // 色散橫掃
    float n=noise(vec2(uv.y*9.,3.1))*.5+noise(vec2(uv.y*42.,7.))*.18;
    float v=clamp((1.-uv.x)*.78+n*.32,0.,1.);
    float m=sweep(v,p,.12); float edge=1.-abs(m*2.-1.);
    float sh=.01*s+.022*edge;
    vec2 ua=uv+vec2(p*.08,0.), ub=uv-vec2((1.-p)*.08,0.);
    vec4 a=vec4(A(ua+vec2(sh,0.)).r,A(ua).g,A(ua-vec2(sh,0.)).b,1.);
    vec4 b=vec4(B(ub+vec2(sh,0.)).r,B(ub).g,B(ub-vec2(sh,0.)).b,1.);
    col=mix(a,b,m);
    col.rgb+=vec3(1.,.95,.9)*pow(edge,6.)*.3;
  } else if(uFx==6){ // 甩鏡
    vec4 a=vec4(0.), b=vec4(0.);
    float pe=ease(p);
    for(int i=0;i<14;i++){ float k=(float(i)/13.-.5)*s*.16;
      a+=A(uv+vec2(pe*.55+k,0.)); b+=B(uv-vec2((1.-pe)*.55,0.)+vec2(k,0.)); }
    col=mix(a/14.,b/14.,smoothstep(.42,.58,p));
    col.rgb*=1.+s*.08;
  } else if(uFx==7){ // 漏光
    float m=smoothstep(.25,.75,p);
    vec2 cc=vec2(.5);
    col=mix(A(cc+(uv-cc)*(1.-p*.04)), B(cc+(uv-cc)*(1.+(1.-p)*.04)), m);
    float l=fbm(uv*vec2(1.4,.7)+vec2(uTime*.35,uTime*.1));
    vec3 leak=vec3(1.,.55,.22)*smoothstep(.35,.85,l+s*.55-uv.x*.35)*s
             +vec3(1.,.8,.55)*smoothstep(.6,1.,1.-length((uv-vec2(.85,.75))*vec2(ra,1.)*.9))*s*.8;
    col.rgb=1.-(1.-col.rgb)*(1.-clamp(leak*.6,0.,1.));
  } else { // 開門
    float gap=ease(p)*.5;
    float top=step(.5,uv.y);
    vec4 a=A(vec2(uv.x, uv.y + mix(gap,-gap,top)));
    a.rgb*=1.-gap*.8;
    vec4 b=B(.5+(uv-.5)*(1.-.12*(1.-p)));
    float m=step(abs(uv.y-.5),gap);
    col=mix(a,b,m);
    float line=smoothstep(.003,0.,abs(abs(uv.y-.5)-gap))*step(.001,gap)*step(gap,.499);
    col.rgb+=vec3(1.,.85,.65)*line*.9;
  }
  vec2 vq=(uv-.5)*vec2(ra*.8,1.);
  col.rgb*=mix(.68,1.,smoothstep(.95,.25,length(vq)));
  col.rgb=mix(col.rgb,col.rgb*vec3(1.05,1.,.92),.55);
  col.rgb=mix(col.rgb, smoothstep(0.,1.,col.rgb), .25);
  col.rgb+=(hash(uv*uRes+fract(uTime*7.31)*100.)-.5)*.03;
  o=vec4(col.rgb,1.);
}`;

function compile(type, src) {
  const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(aLoc); gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);
const U = {};
['uT0','uT1','uRes','uS0','uS1','uC0','uC1','uL0','uL1','uP','uTime','uFx'].forEach((n) => { U[n] = gl.getUniformLocation(prog, n); });
gl.uniform1i(U.uT0, 0); gl.uniform1i(U.uT1, 1);
gl.uniform2f(U.uRes, W, H);
gl.viewport(0, 0, W, H);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

/* ---------------- assets ---------------- */
const loadImage = (src) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('load ' + src)); im.src = src; });
const cache = new Map();
for (const s of SHOTS) {
  if (!cache.has(s.img)) {
    const im = await loadImage(BASE + s.img);
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    cache.set(s.img, { tex:t, w:im.naturalWidth, h:im.naturalHeight });
  }
  s.asset = cache.get(s.img);
}
const logoImg = await loadImage('../../website/public/logo-transparent.png');
const logo = document.createElement('canvas');
logo.width = logoImg.naturalWidth; logo.height = logoImg.naturalHeight;
{ const c = logo.getContext('2d'); c.drawImage(logoImg, 0, 0); c.globalCompositeOperation = 'source-in'; c.fillStyle = '#f3ece2'; c.fillRect(0, 0, logo.width, logo.height); }

const SERIF = '"Noto Serif TC"', SANS = '"Noto Sans TC"', LATIN = '"Cormorant Garamond"';
const allText = WORKS.map((w) => w.join('')).join('') + SERIES.map((s) => s.join('')).join('') +
  '飛熊入夢從木材、結構到生活，每件作品都有自己的故事。家具訂製空間合作木作學堂／・0123456789';
await Promise.all([
  document.fonts.load(`600 100px ${SERIF}`, allText), document.fonts.load(`500 100px ${SERIF}`, allText),
  document.fonts.load(`400 40px ${SANS}`, allText), document.fonts.load(`300 40px ${SANS}`, allText),
  document.fonts.load(`300 40px ${LATIN}`, 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/'),
  document.fonts.load(`400 40px ${LATIN}`, 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/'),
  document.fonts.load(`500 40px ${LATIN}`, 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/')
]);

/* ---------------- timeline ---------------- */
const clamp01 = (x) => Math.min(Math.max(x, 0), 1);
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOutSine = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
const easeInOutCubic = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutExpo = (t) => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const easeInCubic = (t) => t * t * t;

SHOTS.forEach((s, i) => {
  const next = SHOTS[i + 1];
  s.from = s.at - (s.d || 0) / 2;
  s.to = next ? next.at + next.d / 2 : DURATION;
  s.end = next ? next.at : DURATION;
});

function camera(s, t) {
  const u = easeInOutSine(clamp01((t - s.from) / (s.to - s.from)));
  return [lerp(s.z[0], s.z[1], u), lerp(s.f[0][0], s.f[1][0], u), 1 - lerp(s.f[0][1], s.f[1][1], u), lerp(s.r[0], s.r[1], u)];
}

function drawGL(t) {
  let i = SHOTS.length - 1;
  while (i > 0 && t < SHOTS[i].at) i--;
  let a = SHOTS[i], b = a, p = 0, fx = 0;
  const next = SHOTS[i + 1];
  if (next && t >= next.at - next.d / 2) { b = next; p = (t - (next.at - next.d / 2)) / next.d; fx = next.fx; }
  else if (i > 0 && t < a.at + a.d / 2) { b = a; a = SHOTS[i - 1]; p = (t - (b.at - b.d / 2)) / b.d; fx = b.fx; }
  p = easeInOutCubic(clamp01(p));
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, a.asset.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, b.asset.tex);
  gl.uniform2f(U.uS0, a.asset.w, a.asset.h); gl.uniform2f(U.uS1, b.asset.w, b.asset.h);
  gl.uniform4f(U.uC0, ...camera(a, t)); gl.uniform4f(U.uC1, ...camera(b, t));
  gl.uniform1f(U.uL0, a.layout || 0); gl.uniform1f(U.uL1, b.layout || 0);
  gl.uniform1f(U.uP, b === a ? 0 : p);
  gl.uniform1i(U.uFx, fx);
  gl.uniform1f(U.uTime, t);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------------- typography overlay ---------------- */
const out = document.getElementById('out');
const ctx = out.getContext('2d');
const CREAM = '#f8f6f2', SOFT = 'rgba(248,246,242,.72)', AMBER = '#d9a46a';
const M = 110; // safe margin

// 由下往上遮罩進場、往上退場
function phase(t, tin, tout, inDur = .7, outDur = .35) {
  if (t < tin) return null;
  if (tout != null && t >= tout + outDur) return null;
  const ein = easeOutExpo(clamp01((t - tin) / inDur));
  const eout = tout != null ? easeInCubic(clamp01((t - tout) / outDur)) : 0;
  return { off: eout > 0 ? -eout : 1 - ein, alpha: ein * (1 - eout) };
}
function maskText(text, x, y, font, color, ph, opts = {}) {
  if (!ph) return 0;
  ctx.save();
  ctx.font = font;
  ctx.letterSpacing = opts.spacing || '0px';
  ctx.textAlign = opts.align || 'left';
  ctx.textBaseline = 'alphabetic';
  const m = ctx.measureText(text);
  const asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
  const h = asc + desc;
  const left = opts.align === 'center' ? x - m.width / 2 : opts.align === 'right' ? x - m.width : x;
  ctx.beginPath(); ctx.rect(left - 20, y - asc - 6, m.width + 40, h + 14); ctx.clip();
  ctx.globalAlpha = Math.max(ph.alpha, 0) * (opts.alpha ?? 1);
  ctx.fillStyle = color;
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 18;
  ctx.fillText(text, x, y + ph.off * (h + 14));
  ctx.restore();
  return m.width;
}
function line(x, y, w, color, k, alpha = 1, origin = 'left') {
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color;
  const ww = w * k;
  ctx.fillRect(origin === 'center' ? x - ww / 2 : x, y, ww, 2);
  ctx.restore();
}

function drawOverlay(t) {
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(glCanvas, 0, 0);

  // 作品段的左下壓暗，讓字在亮背景也清楚
  const presence = clamp01((t - WORKS_START + .3) / .6) * (1 - clamp01((t - WORKS_END + .4) / .6));
  if (presence > 0) {
    ctx.save(); ctx.globalAlpha = presence;
    let g = ctx.createLinearGradient(0, 0, W * .6, 0);
    g.addColorStop(0, 'rgba(18,14,11,.62)'); g.addColorStop(1, 'rgba(18,14,11,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    g = ctx.createLinearGradient(0, H, 0, H * .5);
    g.addColorStop(0, 'rgba(18,14,11,.7)'); g.addColorStop(1, 'rgba(18,14,11,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    g = ctx.createLinearGradient(0, 0, 0, H * .28);
    g.addColorStop(0, 'rgba(18,14,11,.5)'); g.addColorStop(1, 'rgba(18,14,11,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // 開場
  if (t < 2.6) {
    const cx = W / 2;
    const title = '飛熊入夢';
    const spacing = lerp(64, 40, easeOutExpo(clamp01((t - .6) / 1.4)));
    ctx.save(); ctx.font = `600 150px ${SERIF}`; ctx.letterSpacing = spacing + 'px';
    const tw = ctx.measureText(title).width; ctx.restore();
    let x = cx - tw / 2 + spacing / 2;
    [...title].forEach((ch, k) => {
      const ph = phase(t, .55 + k * .09, 2.0 + k * .03, .9, .38);
      const w = maskText(ch, x, H / 2 + 30, `600 150px ${SERIF}`, CREAM, ph);
      x += w + spacing;
    });
    const lk = easeOutExpo(clamp01((t - 1.0) / .9)) * (1 - easeInCubic(clamp01((t - 2.05) / .35)));
    line(cx, H / 2 + 84, 360, AMBER, lk, .9, 'center');
    maskText("BEAR'S FANTASYLAND", cx, H / 2 + 150, `400 30px ${LATIN}`, SOFT, phase(t, 1.15, 2.08, .8, .32), { align:'center', spacing:'14px' });
    maskText('FURNITURE WORKS', cx, H / 2 + 196, `300 22px ${LATIN}`, AMBER, phase(t, 1.3, 2.12, .8, .3), { align:'center', spacing:'12px' });
  }

  // 系列章節標
  const workShots = SHOTS.filter((s) => s.work != null);
  SERIES.forEach((se, k) => {
    const shots = workShots.filter((s) => WORKS[s.work][4] === k);
    const tin = shots[0].at + .05, tout = shots[shots.length - 1].end - .35;
    const ph = phase(t, tin, tout, .8, .3);
    if (!ph) return;
    const y = 132;
    maskText(String(k + 1).padStart(2, '0'), M, y, `400 34px ${LATIN}`, AMBER, ph, { spacing:'2px' });
    const lk = easeOutExpo(clamp01((t - tin - .1) / .7)) * (1 - easeInCubic(clamp01((t - tout) / .3)));
    line(M + 58, y - 11, 56, AMBER, lk, .9);
    const w = maskText(se[0], M + 136, y, `500 30px ${SERIF}`, CREAM, phase(t, tin + .06, tout, .8, .3), { spacing:'4px' });
    maskText(se[1], M + 136 + w + 22, y - 2, `400 20px ${LATIN}`, SOFT, phase(t, tin + .12, tout, .8, .3), { spacing:'6px' });
  });

  // 作品名稱
  workShots.forEach((s) => {
    const wk = WORKS[s.work];
    const tin = s.at + .08, tout = s.end - .3;
    const dur = tout - tin;
    const inDur = Math.min(.7, dur * .6);
    const big = wk[0].length > 3 ? 92 : 128;
    const yName = H - 250;
    const w = maskText(wk[0], M - 4, yName, `600 ${big}px ${SERIF}`, CREAM, phase(t, tin, tout, inDur, .28), { spacing:'6px' });
    maskText(wk[1], M + w + 26, yName - 6, `300 40px ${LATIN}`, SOFT, phase(t, tin + .05, tout, inDur, .28), { spacing:'10px' });
    const lk = easeOutExpo(clamp01((t - tin - .08) / inDur)) * (1 - easeInCubic(clamp01((t - tout) / .28)));
    line(M, yName + 42, 64, AMBER, lk, .9);
    maskText(`${wk[2]}　·　${wk[3]}`, M + 84, yName + 52, `400 26px ${SANS}`, SOFT, phase(t, tin + .1, tout, inDur, .28), { spacing:'4px' });
  });

  // 計數與總進度
  if (presence > 0) {
    let idx = 0;
    workShots.forEach((s, k) => { if (t >= s.at) idx = k; });
    const cur = String(idx + 1).padStart(2, '0');
    const s = workShots[idx];
    const ph = phase(t, s.at + .04, s.end - .2, .5, .2) || { off:0, alpha:0 };
    ctx.save(); ctx.globalAlpha = presence;
    maskText(cur, W - M - 92, H - 118, `300 64px ${LATIN}`, CREAM, ph, { align:'right' });
    ctx.font = `300 28px ${LATIN}`; ctx.fillStyle = SOFT; ctx.textAlign = 'right'; ctx.letterSpacing = '3px';
    ctx.fillText(`/ ${WORKS.length}`, W - M, H - 120);
    const prog = clamp01((t - WORKS_START) / (WORKS_END - WORKS_START));
    ctx.fillStyle = 'rgba(248,246,242,.22)'; ctx.fillRect(M, H - 70, W - M * 2, 2);
    ctx.fillStyle = CREAM; ctx.fillRect(M, H - 70, (W - M * 2) * prog, 2);
    ctx.restore();
  }

  // 片尾
  if (t > 27.2) {
    const k = easeOutExpo(clamp01((t - 27.45) / 1.2));
    const lw = 760, lh = lw * logo.height / logo.width;
    const sc = lerp(.94, 1, k);
    ctx.save(); ctx.globalAlpha = k;
    ctx.translate(W / 2, H / 2 - 90); ctx.scale(sc, sc);
    ctx.drawImage(logo, -lw / 2, -lh / 2, lw, lh);
    ctx.restore();
    line(W / 2, H / 2 + 60, 300, AMBER, easeOutExpo(clamp01((t - 27.9) / .9)), .9, 'center');
    maskText('從木材、結構到生活，每件作品都有自己的故事。', W / 2, H / 2 + 140, `500 40px ${SERIF}`, CREAM, phase(t, 28.0, null, .9), { align:'center', spacing:'6px' });
    maskText('家具訂製　·　空間合作　·　木作學堂', W / 2, H / 2 + 210, `400 24px ${SANS}`, AMBER, phase(t, 28.35, null, .9), { align:'center', spacing:'8px' });
  }

  // 黑場進出
  const black = Math.max(1 - clamp01(t / .7), clamp01((t - 29.45) / .55));
  if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
}

function renderFrame(t) { drawGL(t); drawOverlay(t); }

function report(msg) { return fetch('/log', { method:'POST', body:String(msg) }).catch(() => {}); }

/* ---------------- modes ---------------- */
const hud = document.getElementById('hud');
if (params.has('render')) {
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  await report('GL ' + (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)));
  const total = Math.round(DURATION * FPS);
  for (let f = 0; f < total; f++) {
    renderFrame(f / FPS);
    const data = ctx.getImageData(0, 0, W, H).data;
    const r = await fetch('/frame', { method:'POST', body:data.buffer });
    if (!r.ok) { await report('ERROR frame ' + f); return; }
    if (f % 30 === 0) await report(`frame ${f}/${total}`);
  }
  await fetch('/done', { method:'POST' });
} else if (params.has('t')) {
  renderFrame(Number(params.get('t')) || 0);
  hud.textContent = 't=' + params.get('t');
  document.title = 'ready';
} else {
  const start = performance.now();
  const loop = (now) => {
    const t = ((now - start) / 1000) % DURATION;
    renderFrame(t);
    hud.textContent = t.toFixed(2) + 's';
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
})().catch((err) => {
  document.body.insertAdjacentHTML('beforeend', `<pre style="color:#f88;position:fixed;top:0">${err.stack}</pre>`);
  fetch('/log', { method:'POST', body:'ERROR ' + err.stack }).catch(() => {});
});
</script>
</body>
</html>
